<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Мои финансы</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root[data-theme="dark"]{--bg:#0f1419;--bg2:#1a1f2b;--card:#1e2532;--card2:#252d3d;--text:#e8ecf3;--muted:#8a94a6;--border:#2a3244;--accent:#4d7fff;--accent2:#6b94ff;--green:#2ecc71;--red:#ff5c5c;--yellow:#f5b945}
:root[data-theme="light"]{--bg:#f4f6fb;--bg2:#e8ecf3;--card:#fff;--card2:#f8f9fb;--text:#1c2333;--muted:#7a8399;--border:#e6e9f2;--accent:#3b6ef5;--accent2:#5b82f0;--green:#1e9e6a;--red:#e04a4a;--yellow:#f2a93b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;padding-bottom:calc(80px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top);overflow-x:hidden;min-height:100vh}
.app-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border)}
.app-header h1{font-size:17px;margin:0;font-weight:700}
.icon-btn{background:transparent;border:none;color:var(--text);font-size:20px;padding:8px;cursor:pointer;border-radius:8px}
.page{display:none;padding:14px}
.page.active{display:block}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--border)}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-card .value{font-size:17px;font-weight:700}
.stat-card.wide{grid-column:1/-1}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted)}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-weight:600;transition:filter .15s}
button:active{filter:brightness(0.9)}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--red);color:#fff}
.btn-small{padding:6px 12px;font-size:13px}
.btn-block{width:100%}
.btn-icon{background:transparent;color:var(--muted);border:none;padding:6px;font-size:16px;border-radius:6px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-tab{flex:1;background:transparent;border:none;color:var(--muted);padding:8px 2px;text-align:center;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav-tab .nav-icon{font-size:22px;line-height:1}
.nav-tab.active{color:var(--accent)}
.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:16px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(77,127,255,0.4);z-index:101;display:flex;align-items:center;justify-content:center;padding:0}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type="date"]{color-scheme:dark}
:root[data-theme="light"] input[type="date"]{color-scheme:light}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-backdrop.active{display:flex}
.modal{background:var(--card);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h2{margin:0;font-size:17px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bank-section{background:var(--card);border-radius:14px;margin-bottom:12px;border:1px solid var(--border);overflow:hidden}
.bank-header{padding:12px 14px;background:var(--card2);display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600;font-size:14px}
.bank-total{font-size:13px;color:var(--muted);font-weight:500}
.product-item{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.product-item .info{flex:1;min-width:0}
.product-item .name{font-weight:600;font-size:14px}
.product-item .meta{font-size:11px;color:var(--muted);margin-top:3px}
.product-item .amount{font-weight:700;font-size:14px;white-space:nowrap}
.badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;background:var(--card2);color:var(--muted);font-weight:700;margin-left:4px;text-transform:uppercase}
.badge.finu{background:rgba(77,127,255,0.2);color:var(--accent2)}
.badge.cushion{background:rgba(245,185,69,0.2);color:var(--yellow)}
.badge.hedge{background:rgba(46,204,113,0.2);color:var(--green)}
.badge.warn{background:rgba(255,92,92,0.2);color:var(--red)}
.badge.pds{background:rgba(139,92,246,0.2);color:#a78bfa}
.progress{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:6px}
.progress-bar{height:100%;background:var(--accent);transition:width .3s}
.progress-bar.green{background:var(--green)}
.progress-bar.red{background:var(--red)}
.progress-bar.yellow{background:var(--yellow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:6px 14px;font-size:13px;white-space:nowrap;cursor:pointer;font-weight:600}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:14px}
.chart-container{position:relative;height:220px;margin-top:8px}
.tx-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.tx-item:active{background:var(--card2)}
.tx-item .icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-weight:700}
.tx-item .icon.income{background:rgba(46,204,113,0.15);color:var(--green)}
.tx-item .icon.expense{background:rgba(255,92,92,0.15);color:var(--red)}
.tx-item .icon.transfer{background:rgba(77,127,255,0.15);color:var(--accent2)}
.tx-item .body{flex:1;min-width:0}
.tx-item .body .title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-item .body .meta{font-size:11px;color:var(--muted);margin-top:2px}
.tx-item .amount{font-weight:700;white-space:nowrap;font-size:14px}
.tx-item .amount.income{color:var(--green)}
.tx-item .amount.expense{color:var(--red)}
.tx-item .amount.transfer{color:var(--accent2)}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card2);border-radius:12px;color:var(--text);font-weight:500;cursor:pointer;border:none;text-align:left;width:100%;font-family:inherit;font-size:15px}
.menu-item .menu-icon{font-size:20px}
.menu-item.warn{color:var(--red)}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--card2);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid var(--border);max-width:90%}
.toast.show{opacity:1}
.search-input{margin-bottom:12px;position:relative}
.search-input input{padding-left:36px}
.search-input::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.role-tag{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;margin-left:6px}
.role-tag.hedge{background:rgba(46,204,113,0.2);color:var(--green)}
.role-tag.cushion{background:rgba(245,185,69,0.2);color:var(--yellow)}
</style>
</head>
<body>
<header class="app-header">
  <h1>💰 Мои финансы</h1>
  <div>
    <button class="icon-btn" id="themeBtn">🌙</button>
    <button class="icon-btn" id="menuBtn">☰</button>
  </div>
</header>
<main>
  <section class="page active" id="page-home"></section>
  <section class="page" id="page-accounts"></section>
  <section class="page" id="page-transactions"></section>
  <section class="page" id="page-debts"></section>
  <section class="page" id="page-stats"></section>
</main>
<button class="fab" id="fabBtn">+</button>
<nav class="bottom-nav">
  <button class="nav-tab active" data-tab="home"><span class="nav-icon">🏠</span>Главная</button>
  <button class="nav-tab" data-tab="accounts"><span class="nav-icon">💳</span>Счета</button>
  <button class="nav-tab" data-tab="transactions"><span class="nav-icon">📋</span>Операции</button>
  <button class="nav-tab" data-tab="debts"><span class="nav-icon">🤝</span>Долги</button>
  <button class="nav-tab" data-tab="stats"><span class="nav-icon">📊</span>Статистика</button>
</nav>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='financeApp_v2',OLD_KEY='financeApp_v1';
const ACC_TYPES={debit:'Дебетовая карта',credit:'Кредитная карта',brokerage:'Брокерский',iis:'ИИС',pds:'ПДС',deposit:'Вклад',savings:'Накопительный',crypto:'Криптобиржа',cash:'Наличные',finu_wallet:'Кошелёк Финуслуги'};
const TERMS={indefinite:'Бессрочный','14d':'14 дней','3m':'3 мес','6m':'6 мес','12m':'1 год','24m':'2 года'};
const TARGET_TYPES=['deposit','savings','brokerage','iis','pds','crypto'];
const SAVINGS_TYPES=['deposit','savings'];
const INVEST_TYPES=['brokerage','iis','pds','crypto'];
const HEDGE_TYPES=['deposit','savings'];
function defaultState(){return {
  settings:{theme:'dark',usdtRate:{mode:'auto',value:90,lastFetched:null,updatedAt:null},cushionTarget:300000},
  ui:{collapsedBanks:[],lastSnapshot:null},
  categories:{
    income:[{id:'sal',name:'Зарплата'},{id:'adv',name:'Аванс'},{id:'freelance',name:'Фриланс'},{id:'gift',name:'Подарки'},{id:'cashback',name:'Кешбэк',passive:true},{id:'coupon',name:'Купоны',passive:true},{id:'dividend',name:'Дивиденды',passive:true},{id:'interest',name:'Проценты по вкладам',passive:true},{id:'taxrefund',name:'Возврат налога',passive:true},{id:'other_inc',name:'Прочий доход'}],
    expense:[{id:'food',name:'Еда'},{id:'transport',name:'Транспорт'},{id:'housing',name:'Жильё'},{id:'utilities',name:'Коммунальные'},{id:'health',name:'Здоровье'},{id:'fun',name:'Развлечения'},{id:'clothes',name:'Одежда'},{id:'phone',name:'Связь'},{id:'subs',name:'Подписки'},{id:'joint',name:'Совместные расходы'},{id:'taxes',name:'Налоги'},{id:'duty',name:'Госпошлина'},{id:'other_exp',name:'Прочее'}]
  },
  banks:[],accounts:[],transactions:[],budgets:[],goals:[],debts:[],counterparties:[],snapshots:[]
};}
let S=defaultState();
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const thisMonth=()=>new Date().toISOString().slice(0,7);
const lastDayOfMonth=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10);};
const fmt=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n||0);
const fmtNum=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n||0);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(defaultState(),JSON.parse(r));else if(localStorage.getItem(OLD_KEY))migrate();}catch(e){console.warn(e);}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Ошибка сохранения');}}
function migrate(){try{const old=JSON.parse(localStorage.getItem(OLD_KEY)||'{}');if(!old.transactions&&!old.investments)return;const b={id:uid(),name:'Основной банк'};S.banks.push(b);const a={id:uid(),bankId:b.id,name:'Основная карта',type:'debit',balance:0,currency:'RUB',isTransit:false,inCushion:false,archived:false};S.accounts.push(a);(old.transactions||[]).forEach(t=>{let catId;const catName=t.category||'';const found=(S.categories[t.type]||[]).find(c=>c.name.toLowerCase()===catName.toLowerCase());if(found)catId=found.id;else{catId=uid();S.categories[t.type].push({id:catId,name:catName||'Прочее'});}S.transactions.push({id:t.id||uid(),type:t.type,amount:t.amount,date:t.date,note:t.note||'',categoryId:catId,accountId:a.id,savingsKind:null});});(old.investments||[]).forEach(i=>{const bb=S.banks.find(x=>x.name==='Брокер')||{id:uid(),name:'Брокер'};if(!S.banks.includes(bb))S.banks.push(bb);S.accounts.push({id:i.id||uid(),bankId:bb.id,name:i.name||'Актив',type:'brokerage',balance:i.current||0,currency:'RUB',isTransit:false,inCushion:false,archived:false});});save();setTimeout(()=>toast('Данные перенесены из v1'),500);}catch(e){console.warn(e);}}
function getBank(id){return S.banks.find(b=>b.id===id);}
function getAcc(id){return S.accounts.find(a=>a.id===id);}
function getCat(type,id){return (S.categories[type]||[]).find(c=>c.id===id);}
function getUSDTRate(){return S.settings.usdtRate.mode==='auto'?(S.settings.usdtRate.lastFetched||S.settings.usdtRate.value):S.settings.usdtRate.value;}
function accValue(a){if(!a)return 0;if(a.currency==='USDT')return a.balance*getUSDTRate();return a.balance||0;}
function isTarget(a){return a&&TARGET_TYPES.includes(a.type)&&!a.isTransit;}
function visibleCats(type){const sixAgo=new Date();sixAgo.setMonth(sixAgo.getMonth()-6);const lim=sixAgo.toISOString().slice(0,10);const used=new Set(S.transactions.filter(t=>t.type===type&&t.date>=lim).map(t=>t.categoryId));return (S.categories[type]||[]).filter(c=>used.has(c.id));}
function catListFor(type){const v=visibleCats(type);return v.length?v:S.categories[type]||[];}
function classifyTransfer(f,t){const fA=getAcc(f),tA=getAcc(t);if(!fA||!tA)return 'ignore';const fT=isTarget(fA),tT=isTarget(tA);if(fT===tT)return 'ignore';if(!fT&&tT){if(SAVINGS_TYPES.includes(tA.type))return 'savings';if(INVEST_TYPES.includes(tA.type))return 'investment';return 'ignore';}if(fT&&!tT)return 'withdraw';return 'ignore';}
function computeTotals(){let totalCap=0,debt=0,creditLimit=0,cushion=0,deposits=0,brokerage=0,crypto=0,pds=0,free=0;S.accounts.filter(a=>!a.archived).forEach(a=>{const v=accValue(a);if(a.type==='credit'){debt+=v;totalCap-=v;creditLimit+=a.creditLimit||0;}else{totalCap+=v;if(['deposit','savings','finu_wallet'].includes(a.type))deposits+=v;if(['brokerage','iis'].includes(a.type))brokerage+=v;if(a.type==='pds')pds+=v;if(a.type==='crypto')crypto+=v;if(['debit','cash'].includes(a.type))free+=v;}if(a.inCushion&&!a.archived)cushion+=v;});return {totalCap,debt,creditLimit,cushion,deposits,brokerage,crypto,pds,free};}
function computeMonth(m){m=m||thisMonth();let income=0,expense=0,savings=0,investment=0,withdraw=0,passive=0;S.transactions.filter(t=>t.date.startsWith(m)).forEach(t=>{if(t.type==='income'){income+=t.amount;const c=getCat('income',t.categoryId);if(c&&c.passive)passive+=t.amount;}else if(t.type==='expense')expense+=t.amount;else if(t.type==='transfer'){const k=t.savingsKind||classifyTransfer(t.accountId,t.toAccountId);if(k==='savings')savings+=t.amount;else if(k==='investment')investment+=t.amount;else if(k==='withdraw')withdraw+=t.amount;}});return {income,expense,savings,investment,withdraw,passive,savedTotal:savings+investment,savingsRate:income>0?(savings+investment)/income*100:0};}
function computeHedge(){const cards=S.accounts.filter(a=>a.type==='credit'&&!a.archived);let hedged=0,total=0;const map={};cards.forEach(c=>{const h=S.accounts.filter(a=>a.role==='hedge'&&a.hedgeFor===c.id&&!a.archived);const hSum=h.reduce((s,a)=>s+accValue(a),0);map[c.id]={debt:accValue(c),hedgeSum:hSum,covered:hSum>=accValue(c)};total+=accValue(c);if(hSum>=accValue(c))hedged+=accValue(c);});return {hedged,total,map};}
function maybeSnapshot(){const now=new Date();const y=now.getFullYear(),m=now.getMonth();const last=new Date(y,m+1,0);if(now.getDate()<last.getDate())return;const mk=`${y}-${String(m+1).padStart(2,'0')}`;if(S.snapshots.some(s=>s.month===mk))return;const snap={month:mk,date:lastDayOfMonth(),accounts:S.accounts.filter(a=>!a.archived).map(a=>({id:a.id,balance:accValue(a)}))};S.snapshots.push(snap);save();}
function maybeArchive(){const zero=S.accounts.filter(a=>!a.archived&&accValue(a)===0&&a.type!=='credit');if(zero.length===0)return;const ageOk=zero.every(a=>{if(!a.updatedAt)return true;const d=(Date.now()-new Date(a.updatedAt).getTime())/86400000;return d>=30;});if(!ageOk)return;zero.forEach(a=>a.archived=true);save();}
let dashFilter='all';
function renderDashboard(){const t=computeTotals();const h=computeHedge();const cp=S.settings.cushionTarget>0?Math.min(100,t.cushion/S.settings.cushionTarget*100):0;const m=computeMonth();const banks=S.banks.filter(b=>{if(dashFilter==='finu')return b.name.toLowerCase().includes('финуслуг');if(dashFilter==='direct')return !b.name.toLowerCase().includes('финуслуг');return true;});const accs=S.accounts.filter(a=>!a.archived&&banks.some(b=>b.id===a.bankId));const el=$('page-home');el.innerHTML=`
<div class="stat-grid">
<div class="stat-card wide"><div class="label">Общий капитал</div><div class="value" style="font-size:24px">${fmt(t.totalCap)}</div>${t.debt>0?`<div class="muted" style="font-size:12px;margin-top:4px">Долг по кредиткам: <span class="neg">${fmt(t.debt)}</span></div>`:''}</div>
<div class="stat-card"><div class="label">Свободно</div><div class="value">${fmt(t.free)}</div></div>
<div class="stat-card"><div class="label">Кредиты</div><div class="value neg">${t.debt>0?'−'+fmt(t.debt):fmt(0)}</div>${t.creditLimit>0?`<div class="muted" style="font-size:11px;margin-top:2px">доступно ${fmt(Math.max(0,t.creditLimit-t.debt))}</div>`:''}</div>
<div class="stat-card"><div class="label">Вклады</div><div class="value">${fmt(t.deposits)}</div></div>
<div class="stat-card"><div class="label">Брокерские</div><div class="value">${fmt(t.brokerage)}</div></div>
<div class="stat-card"><div class="label">ПДС</div><div class="value">${fmt(t.pds)}</div></div>
<div class="stat-card"><div class="label">Крипта</div><div class="value">${fmt(t.crypto)}</div><div class="muted" style="font-size:11px">USDT: ${fmtNum(getUSDTRate())}₽</div></div>
<div class="stat-card"><div class="label">Подушка</div><div class="value">${fmt(t.cushion)}</div><div class="progress"><div class="progress-bar ${cp>=100?'green':'yellow'}" style="width:${cp}%"></div></div><div class="muted" style="font-size:11px;margin-top:4px">${cp.toFixed(0)}% из ${fmt(S.settings.cushionTarget)}</div></div>
</div>
<div class="card"><div style="font-weight:700;margin-bottom:10px">Этот месяц</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px">
<div>Доходы<div class="pos" style="font-weight:700;font-size:15px">${fmt(m.income)}</div></div>
<div>Расходы<div class="neg" style="font-weight:700;font-size:15px">${fmt(m.expense)}</div></div>

function renderProductRow(a){const meta=[];if(a.type==='deposit'||a.type==='savings'){if(a.rate)meta.push(a.rate+'%');if(a.term&&a.term!=='indefinite')meta.push(TERMS[a.term]||a.term);if(a.viaFinuslugi)meta.push('Финуслуги');if(a.autoRenew)meta.push('авто-продление');if(a.refillable)meta.push('пополняемый');}const v=accValue(a);let roleTag='';if(a.role==='hedge')roleTag='<span class="role-tag hedge">ХЕДЖ</span>';else if(a.role==='cushion')roleTag='<span class="role-tag cushion">ПОДУШКА</span>';
if(a.type==='credit'){const l=a.creditLimit||0,av=Math.max(0,l-v);const u=l>0?v/l*100:0;const cls=u>80?'red':u>50?'yellow':'green';const hedge=computeHedge().map[a.id];const hTag=hedge&&hedge.covered?'<span class="badge hedge">✓ ХЕДЖ</span>':(hedge&&hedge.hedgeSum>0?'<span class="badge warn">⚠ ЧАСТИЧНО</span>':'<span class="badge warn">⚠ БЕЗ ХЕДЖА</span>');return `<div class="product-item" onclick="openAccountModal('${a.id}')"><div class="info"><div class="name">${esc(a.name)} ${hTag}</div><div class="meta">Кредитная${l>0?' · потрачено '+fmt(v)+' из '+fmt(l):''}</div>${l>0?`<div class="progress"><div class="progress-bar ${cls}" style="width:${Math.min(100,u)}%"></div></div>`:''}</div><div style="text-align:right"><div class="amount neg" data-edit-bal="${a.id}">−${fmt(v)}</div>${l>0?`<div class="muted" style="font-size:11px;margin-top:2px">доступно ${fmt(av)}</div>`:''}</div></div>`;}
return `<div class="product-item" onclick="openAccountModal('${a.id}')"><div class="info"><div class="name">${esc(a.name)}${roleTag} ${a.inCushion?'<span class="badge cushion">⭐</span>':''} ${a.viaFinuslugi?'<span class="badge finu">Финуслуги</span>':''}</div><div class="meta">${ACC_TYPES[a.type]||a.type}${meta.length?' · '+meta.join(' · '):''}</div></div><div class="amount" data-edit-bal="${a.id}" style="cursor:pointer">${fmt(v)}${a.currency==='USDT'?' <small>'+fmtNum(a.balance)+'U</small>':''}</div></div>`;}
function renderAccounts(){const el=$('page-accounts');const showArch=S.ui.showArchived;let html=`<button class="btn-primary btn-block" style="margin-bottom:12px" onclick="openBankModal()">+ Добавить банк</button>`;const banks=S.banks.filter(b=>{const active=S.accounts.filter(a=>a.bankId===b.id&&(!a.archived||showArch));return active.length||!S.accounts.some(a=>a.bankId===b.id);});if(!banks.length)html+='<div class="empty">Нет банков.</div>';banks.forEach(b=>{const accs=S.accounts.filter(a=>a.bankId===b.id&&(showArch||!a.archived));const total=accs.reduce((s,a)=>s+(a.type==='credit'?-accValue(a):accValue(a)),0);html+=`<div class="bank-section"><div class="bank-header" style="cursor:default"><span>${esc(b.name)}</span><span class="bank-total">${fmt(total)}</span></div><div>${accs.length?accs.map(a=>{const arch=a.archived?'<span class="badge">АРХИВ</span>':'';if(a.type==='credit'){const v=accValue(a),l=a.creditLimit||0,av=Math.max(0,l-v);return `<div class="product-item"><div class="info" onclick="openAccountModal('${a.id}')" style="cursor:pointer"><div class="name">${esc(a.name)} ${arch}</div><div class="meta">Кредитная${l>0?' · лимит '+fmt(l):''}</div></div><div style="text-align:right"><div class="amount neg">−${fmt(v)}</div>${l>0?`<div class="muted" style="font-size:11px">доступно ${fmt(av)}</div>`:''}</div><button class="btn-icon" onclick="event.stopPropagation();openAccountModal('${a.id}')">✏️</button></div>`;}return `<div class="product-item"><div class="info" onclick="openAccountModal('${a.id}')" style="cursor:pointer"><div class="name">${esc(a.name)} ${arch}</div><div class="meta">${ACC_TYPES[a.type]||a.type}${(a.type==='deposit'||a.type==='savings')&&a.rate?' · '+a.rate+'%':''}</div></div><div class="amount">${fmt(accValue(a))}</div><button class="btn-icon" onclick="event.stopPropagation();openAccountModal('${a.id}')">✏️</button></div>`;}).join(''):'<div class="empty" style="padding:14px;font-size:13px">Нет счетов</div>'}</div><div style="padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap"><button class="btn-secondary btn-small" onclick="openAccountModal(null,'${b.id}')">+ Счёт</button><button class="btn-icon" style="margin-left:auto" onclick="deleteBank('${b.id}')">🗑</button></div></div>`;});html+=`<button class="btn-secondary btn-block" style="margin-top:12px" onclick="S.ui.showArchived=!S.ui.showArchived;save();renderAccounts()">${showArch?'Скрыть архив':'Показать архив'}</button>`;el.innerHTML=html;}

function renderTransactions(){const el=$('page-transactions');let list=[...S.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));if(txFilter!=='all')list=list.filter(t=>t.type===txFilter);if(txSearch.trim()){const q=txSearch.trim().toLowerCase();list=list.filter(t=>{const cat=getCat(t.type,t.categoryId);const acc=getAcc(t.accountId);const to=getAcc(t.toAccountId);const hay=[t.note||'',cat?cat.name:'',acc?acc.name:'',to?to.name:'',String(t.amount),t.date].join(' ').toLowerCase();return hay.includes(q);});}let html=`<div class="search-input"><input id="txSearchInp" type="text" placeholder="Поиск по всему..." value="${esc(txSearch)}"></div><div class="chips"><button class="chip ${txFilter==='all'?'active':''}" data-f="all">Все</button><button class="chip ${txFilter==='income'?'active':''}" data-f="income">Доходы</button><button class="chip ${txFilter==='expense'?'active':''}" data-f="expense">Расходы</button><button class="chip ${txFilter==='transfer'?'active':''}" data-f="transfer">Переводы</button></div>`;if(!list.length)html+='<div class="empty">Нет операций</div>';else{let last='';list.forEach(t=>{if(t.date!==last){html+=`<div style="font-size:11px;color:var(--muted);font-weight:700;padding:8px 4px 4px;text-transform:uppercase">${new Date(t.date).toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'})}</div>`;last=t.date;}html+=renderTxItem(t);});}el.innerHTML=html;el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{txFilter=c.dataset.f;renderTransactions();});const si=$('txSearchInp');if(si){si.oninput=e=>{txSearch=e.target.value;renderTransactions();si.focus();si.setSelectionRange(si.value.length,si.value.length);};}}
function renderTxItem(t){let icon,title,meta,amount,sign,cls;if(t.type==='income'){const c=getCat('income',t.categoryId);icon='↓';title=c?c.name:'Доход';cls='income';const a=getAcc(t.accountId);meta=a?a.name:'';sign='+';amount=t.amount;}else if(t.type==='expense'){const c=getCat('expense',t.categoryId);icon='↑';title=c?c.name:'Расход';cls='expense';const a=getAcc(t.accountId);meta=a?a.name:'';sign='−';amount=t.amount;}else{const f=getAcc(t.accountId),to=getAcc(t.toAccountId);icon='⇄';title=(f?f.name:'?')+' → '+(to?to.name:'?');cls='transfer';const k=t.savingsKind||classifyTransfer(t.accountId,t.toAccountId);meta={savings:'в накопления',investment:'в инвестиции',withdraw:'снятие',ignore:'между'}[k]||'';sign='';amount=t.amount;}return `<div class="tx-item" onclick="openTxModal('${t.id}')"><div class="icon ${cls}">${icon}</div><div class="body"><div class="title">${esc(title)}</div><div class="meta">${esc(meta)}${t.note?' · '+esc(t.note):''}</div></div><div class="amount ${cls}">${sign}${fmt(amount)}</div></div>`;}

function duplicateAccount(id){const a=getAcc(id);if(!a)return;const copy={...a,id:uid(),name:a.name+' (копия)',balance:0,archived:false,updatedAt:new Date().toISOString()};S.accounts.push(copy);save();renderAll();closeModal();toast('Дублировано');}

function openBankModal(){openModal(`<div class="modal-header"><h2>Новый банк</h2><button class="btn-icon" onclick="closeModal()">✕</button></div><form id="bankForm"><div class="form-group"><label>Название</label><input id="bankName" placeholder="Т-Банк / Финуслуги / ..." required></div><button type="submit" class="btn-primary btn-block">Добавить</button></form>`);$('bankForm').onsubmit=e=>{e.preventDefault();const n=$('bankName').value.trim();if(!n)return;S.banks.push({id:uid(),name:n});save();renderAll();closeModal();toast('Банк добавлен');};}
function renderDebts(){const el=$('page-debts');const mine=S.debts.filter(d=>d.direction==='lent'&&d.remaining>0);const owe=S.debts.filter(d=>d.direction==='borrowed'&&d.remaining>0);const totalMine=mine.reduce((s,d)=>s+d.remaining,0);const totalOwe=owe.reduce((s,d)=>s+d.remaining,0);let html=`<div class="stat-grid"><div class="stat-card wide"><div class="label">Чистая позиция по долгам</div><div class="value ${totalMine-totalOwe>=0?'pos':'neg'}">${fmt(totalMine-totalOwe)}</div></div><div class="stat-card"><div class="label">Мне должны</div><div class="value pos">${fmt(totalMine)}</div></div><div class="stat-card"><div class="label">Я должен</div><div class="value neg">${fmt(totalOwe)}</div></div></div><button class="btn-primary btn-block" style="margin-bottom:12px" onclick="openDebtModal()">+ Добавить долг</button>`;
if(!S.debts.length)html+='<div class="empty">Нет долгов</div>';
else{S.debts.forEach(d=>{const cp=S.counterparties.find(c=>c.id===d.counterpartyId);const cpName=cp?cp.name:'?';const isLent=d.direction==='lent';const cls=isLent?'pos':'neg';const status=d.remaining===0?'<span class="badge">ЗАКРЫТ</span>':'';html+=`<div class="card" style="cursor:pointer" onclick="openDebtModal('${d.id}')"><div style="display:flex;justify-content:space-between;align-items:start"><div><div style="font-weight:700">${esc(cpName)} ${status}</div><div class="muted" style="font-size:12px;margin-top:2px">${isLent?'Мне должен':'Я должен'} · ${d.date}${d.note?' · '+esc(d.note):''}</div></div><div style="text-align:right"><div class="${cls}" style="font-weight:700;font-size:16px">${isLent?'+':'-'}${fmt(d.remaining)}</div><div class="muted" style="font-size:11px">из ${fmt(d.amount)}</div></div></div></div>`;});}el.innerHTML=html;}
function openDebtModal(id){const d=id?S.debts.find(x=>x.id===id):null;const isEdit=!!d;const accs=S.accounts.filter(a=>!a.archived);const form=d?{...d}:{id:null,direction:'lent',counterpartyId:'',amount:'',date:today(),note:'',accountId:accs[0]?.id,remaining:''};openModal(`
<div class="modal-header"><h2>${isEdit?'Долг':'Новый долг'}</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>
<form id="debtForm">
<div class="form-group"><label>Направление</label><select id="dbtDir"><option value="lent" ${form.direction==='lent'?'selected':''}>Я дал в долг</option><option value="borrowed" ${form.direction==='borrowed'?'selected':''}>Я взял в долг</option></select></div>
<div class="form-group"><label>Контрагент</label><select id="dbtCp">${S.counterparties.map(c=>`<option value="${c.id}" ${form.counterpartyId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}<option value="__new">+ Новый контрагент</option></select></div>
<div class="form-row"><div class="form-group"><label>Сумма</label><input id="dbtAmount" type="number" step="0.01" min="0.01" value="${form.amount||''}" required></div><div class="form-group"><label>Дата</label><input id="dbtDate" type="date" value="${form.date||today()}" required></div></div>
<div class="form-group"><label>Счёт-источник</label><select id="dbtAcc">${accs.map(a=>`<option value="${a.id}" ${form.accountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
<div class="form-group"><label>Комментарий</label><input id="dbtNote" value="${esc(form.note||'')}"></div>
${isEdit?`<div class="form-group"><label>Остаток долга</label><input id="dbtRemain" type="number" step="0.01" min="0" value="${form.remaining}"></div>`:''}
<button type="submit" class="btn-primary btn-block">${isEdit?'Сохранить':'Добавить'}</button>
${isEdit?`<button type="button" class="btn-secondary btn-block" style="margin-top:8px" onclick="openPaymentModal('${id}')">Внести платёж</button><button type="button" class="btn-danger btn-block" style="margin-top:8px" onclick="deleteDebt('${id}')">Удалить</button>`:''}
</form>`);
$('dbtCp').onchange=e=>{if(e.target.value==='__new'){const n=prompt('Имя контрагента:');if(n&&n.trim()){const c={id:uid(),name:n.trim()};S.counterparties.push(c);save();openDebtModal(id);}}};
$('debtForm').onsubmit=e=>{e.preventDefault();const amt=parseFloat($('dbtAmount').value);if(!(amt>0))return;const cpId=$('dbtCp').value;if(cpId==='__new'){toast('Выберите контрагента');return;}const data={id:id||uid(),direction:$('dbtDir').value,counterpartyId:cpId,amount:amt,date:$('dbtDate').value,note:$('dbtNote').value.trim(),accountId:$('dbtAcc').value,remaining:isEdit?parseFloat($('dbtRemain').value)||0:amt,payments:d?d.payments||[]:[]};if(isEdit){const i=S.debts.findIndex(x=>x.id===id);S.debts[i]=data;}else S.debts.push(data);save();renderAll();closeModal();toast(isEdit?'Сохранено':'Долг добавлен');};}
function openPaymentModal(id){const d=S.debts.find(x=>x.id===id);if(!d)return;openModal(`<div class="modal-header"><h2>Платёж по долгу</h2><button class="btn-icon" onclick="closeModal()">✕</button></div><form id="payForm"><div class="muted" style="font-size:13px;margin-bottom:8px">Остаток: ${fmt(d.remaining)}</div><div class="form-group"><label>Сумма платежа</label><input id="payAmt" type="number" step="0.01" min="0.01" required></div><div class="form-group"><label>Дата</label><input id="payDate" type="date" value="${today()}" required></div><button type="submit" class="btn-primary btn-block">Внести</button></form>`);$('payForm').onsubmit=e=>{e.preventDefault();const amt=parseFloat($('payAmt').value);if(!(amt>0))return;d.remaining=Math.max(0,d.remaining-amt);d.payments=d.payments||[];d.payments.push({date:$('payDate').value,amount:amt});save();renderAll();closeModal();toast('Платёж внесён');};}
function deleteDebt(id){if(!confirm('Удалить долг?'))return;S.debts=S.debts.filter(d=>d.id!==id);save();renderAll();closeModal();}
function renderStats(){const el=$('page-stats');const m=computeMonth();const t=computeTotals();const cp=S.settings.cushionTarget>0?Math.min(100,t.cushion/S.settings.cushionTarget*100):0;let budgetHTML='';if(!S.budgets.length)budgetHTML='<div class="empty" style="padding:14px">Нет бюджетов</div>';else{S.budgets.forEach(b=>{const cat=getCat('expense',b.categoryId);if(!cat)return;const spent=S.transactions.filter(t=>t.type==='expense'&&t.categoryId===b.categoryId&&t.date.startsWith(thisMonth())).reduce((s,t)=>s+t.amount,0);const pct=b.limit>0?Math.min(100,spent/b.limit*100):0;const cls=pct>100?'red':pct>80?'yellow':'green';budgetHTML+=`<div style="padding:10px 0;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><strong>${esc(cat.name)}</strong><span>${fmt(spent)} / ${fmt(b.limit)}</span></div><div class="progress"><div class="progress-bar ${cls}" style="width:${pct}%"></div></div></div>`;});}el.innerHTML=`
<div class="stat-grid"><div class="stat-card wide"><div class="label">Итог за ${new Date().toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px"><div><div class="muted" style="font-size:11px">Доходы</div><div class="pos" style="font-weight:700">${fmt(m.income)}</div></div><div><div class="muted" style="font-size:11px">Расходы</div><div class="neg" style="font-weight:700">${fmt(m.expense)}</div></div><div><div class="muted" style="font-size:11px">В накопления</div><div style="font-weight:700">${fmt(m.savings)}</div></div><div><div class="muted" style="font-size:11px">В инвестиции</div><div style="font-weight:700">${fmt(m.investment)}</div></div></div></div><div class="stat-card"><div class="label">Свободный поток</div><div class="value pos">${fmt(m.passive)}</div></div><div class="stat-card"><div class="label">Норма сбережений</div><div class="value">${m.savingsRate.toFixed(0)}%</div></div></div>
<div class="card"><div style="font-weight:700;margin-bottom:8px">Доходы/расходы (12 мес)</div><div class="chart-container"><canvas id="chartBar"></canvas></div></div>
<div class="card"><div style="font-weight:700;margin-bottom:8px">Накопления по месяцам</div><div class="chart-container"><canvas id="chartSavings"></canvas></div></div>
<div class="card"><div style="font-weight:700;margin-bottom:8px">Структура капитала</div><div class="chart-container"><canvas id="chartPie"></canvas></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><strong>Бюджеты</strong><button class="btn-small btn-secondary" onclick="openBudgetModal()">+</button></div>${budgetHTML}</div>
<div class="card"><div style="font-weight:700;margin-bottom:8px">Подушка безопасности</div><div style="font-size:13px;margin-bottom:6px">${fmt(t.cushion)} / ${fmt(S.settings.cushionTarget)} (${cp.toFixed(0)}%)</div><div class="progress"><div class="progress-bar ${cp>=100?'green':'yellow'}" style="width:${cp}%"></div></div></div>`;renderCharts();}
let c1,c2,c3;
function renderCharts(){const months=[];const cur=new Date();for(let i=11;i>=0;i--){const d=new Date(cur.getFullYear(),cur.getMonth()-i,1);months.push(d.toISOString().slice(0,7));}const inc=months.map(m=>S.transactions.filter(t=>t.type==='income'&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0));const exp=months.map(m=>S.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0));const sv=months.map(m=>{const k=computeMonth(m);return k.savings+k.investment;});const labels=months.map(m=>{const [y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('ru-RU',{month:'short'});});if(c1)c1.destroy();if($('chartBar'))c1=new Chart($('chartBar'),{type:'bar',data:{labels,datasets:[{label:'Доходы',data:inc,backgroundColor:'#2ecc71',borderRadius:4},{label:'Расходы',data:exp,backgroundColor:'#ff5c5c',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:10}}}},scales:{y:{beginAtZero:true,ticks:{font:{size:10}}},x:{ticks:{font:{size:9}}}}}});if(c2)c2.destroy();if($('chartSavings'))c2=new Chart($('chartSavings'),{type:'line',data:{labels,datasets:[{label:'Накоплено',data:sv,borderColor:'#4d7fff',backgroundColor:'rgba(77,127,255,0.15)',fill:true,tension:0.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{font:{size:10}}},x:{ticks:{font:{size:9}}}}}});if(c3)c3.destroy();if($('chartPie')){const t=computeTotals();c3=new Chart($('chartPie'),{type:'doughnut',data:{labels:['Вклады','Брокерские','ПДС','Крипта','Свободные','Кредиты'],datasets:[{data:[t.deposits,t.brokerage,t.pds,t.crypto,t.free,t.debt],backgroundColor:['#4d7fff','#8b5cf6','#a78bfa','#f5b945','#2ecc71','#ff5c5c'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}}});}}
function openBudgetModal(){openModal(`<div class="modal-header"><h2>Бюджет</h2><button class="btn-icon" onclick="closeModal()">✕</button></div><form id="budgetForm"><div class="form-group"><label>Категория</label><select id="budCat">${catListFor('expense').map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="form-group"><label>Лимит в месяц (₽)</label><input id="budLimit" type="number" step="1" min="1" required></div><button type="submit" class="btn-primary btn-block">Сохранить</button></form>${S.budgets.length?`<div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px">${S.budgets.map(b=>{const c=getCat('expense',b.categoryId);return c?`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px"><span>${esc(c.name)}: ${fmt(b.limit)}</span><button class="btn-icon" onclick="delBudget('${b.categoryId}')">✕</button></div>`:'';}).join('')}</div>`:''}`);$('budgetForm').onsubmit=e=>{e.preventDefault();const cid=$('budCat').value,lim=parseFloat($('budLimit').value);if(!(lim>0))return;const i=S.budgets.findIndex(b=>b.categoryId===cid);if(i>=0)S.budgets[i].limit=lim;else S.budgets.push({categoryId:cid,limit:lim});save();renderAll();closeModal();toast('Сохранено');};}
function delBudget(cid){S.budgets=S.budgets.filter(b=>b.categoryId!==cid);save();renderAll();closeModal();}
function openMenu(){openModal(`<div class="modal-header"><h2>Меню</h2><button class="btn-icon" onclick="closeModal()">✕</button></div><div class="menu-list"><button class="menu-item" onclick="openSettings()"><span class="menu-icon">⚙️</span>Настройки</button><button class="menu-item" onclick="openCounterparties()"><span class="menu-icon">👥</span>Контрагенты</button><button class="menu-item" onclick="openImportModal()"><span class="menu-icon">📥</span>Импорт CSV/XLSX</button><button class="menu-item" onclick="exportCSV()"><span class="menu-icon">📤</span>Экспорт CSV</button><button class="menu-item" onclick="exportJSON()"><span class="menu-icon">💾</span>Резервная копия JSON</button><button class="menu-item" onclick="importJSON()"><span class="menu-icon">📂</span>Восстановить из JSON</button><button class="menu-item warn" onclick="resetAll()"><span class="menu-icon">🗑</span>Сбросить всё</button></div>`);}
function openCounterparties(){openModal(`<div class="modal-header"><h2>Контрагенты</h2><button class="btn-icon" onclick="closeModal()">✕</button></div><button class="btn-primary btn-block" style="margin-bottom:12px" onclick="const n=prompt('Имя:');if(n&&n.trim()){S.counterparties.push({id:uid(),name:n.trim()});save();openCounterparties();}">+ Добавить</button>${S.counterparties.length?S.counterparties.map(c=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)"><span>${esc(c.name)}</span><button class="btn-icon" onclick="S.counterparties=S.counterparties.filter(x=>x.id!=='${c.id}');save();openCounterparties()">✕</button></div>`).join(''):'<div class="empty">Нет контрагентов</div>'}`);}
function openSettings(){openModal(`<div class="modal-header"><h2>Настройки</h2><button class="btn-icon" onclick="closeModal()">✕</button></div><div class="form-group"><label>Курс USDT → ₽</label><select id="usdtMode"><option value="auto" ${S.settings.usdtRate.mode==='auto'?'selected':''}>Авто (CoinGecko)</option><option value="manual" ${S.settings.usdtRate.mode==='manual'?'selected':''}>Вручную</option></select></div><div class="form-group"><label>Ручное значение</label><input id="usdtValue" type="number" step="0.01" value="${S.settings.usdtRate.value||90}"></div><div class="form-group"><label>Последний авто-курс: ${S.settings.usdtRate.lastFetched?fmtNum(S.settings.usdtRate.lastFetched)+'₽':'—'}</label><button class="btn-secondary btn-small" onclick="fetchUSDT()">Обновить</button></div><div class="form-group"><label>Цель подушки (₽)</label><input id="cushionTarget" type="number" step="1000" value="${S.settings.cushionTarget||300000}"></div><button class="btn-primary btn-block" onclick="saveSettings()">Сохранить</button>`);}
function saveSettings(){S.settings.usdtRate.mode=$('usdtMode').value;S.settings.usdtRate.value=parseFloat($('usdtValue').value)||90;S.settings.cushionTarget=parseFloat($('cushionTarget').value)||300000;save();renderAll();closeModal();toast('Сохранено');}
async function fetchUSDT(){try{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=rub');const d=await r.json();if(d.tether?.rub){S.settings.usdtRate.lastFetched=d.tether.rub;S.settings.usdtRate.updatedAt=new Date().toISOString();save();toast('Курс: '+fmtNum(d.tether.rub)+'₽');renderAll();}}catch(e){toast('Не удалось обновить курс');}}
function resetAll(){if(!confirm('Удалить ВСЕ данные?'))return;if(!confirm('Точно? Сначала Экспорт JSON!'))return;localStorage.removeItem(KEY);location.reload();}
function exportJSON(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`finance-backup-${today()}.json`;a.click();toast('Сохранено');}
function importJSON(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.transactions||!d.accounts)throw new Error('bad');if(confirm('Заменить данные?')){S=Object.assign(defaultState(),d);save();renderAll();closeModal();toast('Восстановлено');}}catch(err){alert('Ошибка: '+err.message);}};r.readAsText(f);};inp.click();}
function exportCSV(){const rows=[['Дата','Тип','Сумма','Категория/Счета','Комментарий']];[...S.transactions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{let c='';if(t.type==='income'){const x=getCat('income',t.categoryId);c=x?x.name:'';}else if(t.type==='expense'){const x=getCat('expense',t.categoryId);c=x?x.name:'';}else{const f=getAcc(t.accountId),to=getAcc(t.toAccountId);c=(f?f.name:'?')+' → '+(to?to.name:'?');}rows.push([t.date,t.type,t.amount,c,t.note||'']);});const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`finance-${today()}.csv`;a.click();toast('CSV сохранён');}
function openImportModal(){if(!S.accounts.length){toast('Сначала счёт');return;}openModal(`<div class="modal-header"><h2>Импорт</h2><button class="btn-icon" onclick="closeModal()">✕</button></div><div class="form-group"><label>Файл (CSV/XLSX)</label><input type="file" id="importFile" accept=".csv,.xlsx,.xls"></div><div id="importPreview"></div>`);$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let rows;if(/\.(xlsx|xls)$/i.test(f.name)){const buf=await f.arrayBuffer();const wb=XLSX.read(buf);const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});}else{const txt=await f.text();rows=txt.split(/\r?\n/).map(l=>l.split(/[;,\t]/));}if(!rows.length){toast('Пусто');return;}renderImportMapping(rows);}catch(err){alert('Ошибка: '+err.message);}};}
function renderImportMapping(rows){const header=rows[0],data=rows.slice(1).filter(r=>r.some(c=>c!==''&&c!=null));if(!data.length){toast('Нет данных');return;}const opts=header.map((h,i)=>`<option value="${i}">${esc(String(h||'Колонка '+(i+1)))}</option>`).join('');$('importPreview').innerHTML=`<div class="form-group"><label>Дата</label><select id="impDate">${opts}</select></div><div class="form-group"><label>Сумма</label><select id="impAmount">${opts}</select></div><div class="form-group"><label>Описание</label><select id="impNote"><option value="">—</option>${opts}</select></div><div class="form-row"><div class="form-group"><label>Тип</label><select id="impType"><option value="expense">Расход</option><option value="income">Доход</option></select></div><div class="form-group"><label>Категория</label><select id="impCat">${catListFor('expense').map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div></div><div class="form-group"><label>Счёт</label><select id="impAcc">${S.accounts.filter(a=>!a.archived).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="muted" style="font-size:12px;margin:8px 0">Строк: ${data.length}</div><button class="btn-primary btn-block" data-import='${JSON.stringify(JSON.stringify(data)).replace(/'/g,"&#39;")}'>Импортировать</button>`;$('impType').onchange=()=>{const t=$('impType').value;$('impCat').innerHTML=(t==='income'?catListFor('income'):catListFor('expense')).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');};$('importPreview').querySelector('[data-import]').onclick=e=>doImport(e.target.dataset.import);}
function doImport(dj){const data=JSON.parse(dj);const dC=+$('impDate').value,aC=+$('impAmount').value,nC=$('impNote').value===''?-1:+$('impNote').value;const type=$('impType').value,catId=$('impCat').value,accId=$('impAcc').value;let cnt=0;data.forEach(r=>{const rd=r[dC],ra=r[aC];if(ra==null||ra==='')return;let amt=parseFloat(String(ra).replace(/[^\d.,-]/g,'').replace(',','.'));if(!(amt>0))return;let date;if(typeof rd==='number'){const d=new Date((rd-25569)*86400000);date=d.toISOString().slice(0,10);}else{const s=String(rd).trim();const m=s.match(/(\d{1,4})[.\/-](\d{1,2})[.\/-](\d{1,4})/);if(m){let y,mo,d;if(m[1].length===4){y=m[1];mo=m[2];d=m[3];}else{y=m[3];mo=m[2];d=m[1];}date=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}else{date=today();}}S.transactions.push({id:uid(),type,amount:amt,date,categoryId:catId,accountId:accId,note:nC>=0?String(r[nC]||''):'',savingsKind:null});cnt++;});save();renderAll();closeModal();toast(`Импортировано ${cnt}`);}
function applyTheme(){document.documentElement.setAttribute('data-theme',S.settings.theme);$('themeBtn').textContent=S.settings.theme==='dark'?'🌙':'☀️';document.querySelector('meta[name="theme-color"]').setAttribute('content',S.settings.theme==='dark'?'#0f1419':'#f4f6fb');}
$('themeBtn').onclick=()=>{S.settings.theme=S.settings.theme==='dark'?'light':'dark';save();applyTheme();};
document.querySelectorAll('.nav-tab').forEach(t=>{t.onclick=()=>{document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('page-'+t.dataset.tab).classList.add('active');if(t.dataset.tab==='stats')renderStats();if(t.dataset.tab==='debts')renderDebts();window.scrollTo(0,0);};});
$('fabBtn').onclick=()=>openTxModal();
$('menuBtn').onclick=openMenu;
function renderAll(){renderDashboard();renderAccounts();renderTransactions();renderDebts();renderStats();}
load();
if(S.banks.length===0){S.banks.push({id:uid(),name:'Основной банк'});save();}
applyTheme();
maybeSnapshot();
maybeArchive();
renderAll();
if(S.settings.usdtRate.mode==='auto')fetchUSDT();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
