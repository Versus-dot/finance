<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Мои финансы</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
:root[data-theme="dark"]{--bg:#0f1419;--bg2:#1a1f2b;--card:#1e2532;--card2:#252d3d;--text:#e8ecf3;--muted:#8a94a6;--border:#2a3244;--accent:#4d7fff;--accent2:#6b94ff;--green:#2ecc71;--red:#ff5c5c;--yellow:#f5b945;--purple:#a78bfa;--debt:#12161f}
:root[data-theme="light"]{--bg:#f4f6fb;--bg2:#e8ecf3;--card:#fff;--card2:#f8f9fb;--text:#1c2333;--muted:#7a8399;--border:#e6e9f2;--accent:#3b6ef5;--accent2:#5b82f0;--green:#1e9e6a;--red:#e04a4a;--yellow:#f2a93b;--purple:#8b5cf6;--debt:#333}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:var(--font-size, 15px);padding-bottom:calc(80px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top);overflow-x:hidden;min-height:100vh;max-width:1200px;margin:0 auto;}
.app-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border)}
.app-header h1{font-size:17px;margin:0;font-weight:700}
.icon-btn{background:transparent;border:none;color:var(--text);font-size:20px;padding:8px;cursor:pointer;border-radius:8px}
.page{display:none;padding:14px}
.page.active{display:block}

/* Главная (Дзен-мани стиль) */
.total-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; padding: 0 4px; }
.total-val { font-size: 26px; font-weight: 800; margin-top: 4px; }
.total-label { font-size: 12px; color: var(--muted); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px;}

.banks-carousel { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
.banks-carousel::-webkit-scrollbar { display: none; }
.bank-chip { flex-shrink: 0; background: var(--card2); border: 1px solid var(--border); border-radius: 14px; padding: 12px; min-width: 130px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 6px; }
.bank-chip.active { border-color: var(--accent); background: rgba(77,127,255,0.1); }
.bank-chip .bc-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px;}
.bank-chip .bc-bal { font-size: 15px; font-weight: 800; }
.bank-chip .bc-debt { font-size: 11px; color: var(--muted); font-weight: 700; }

.bank-group { margin-bottom: 16px; background: var(--card); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
.bank-group-header { padding: 10px 14px; background: var(--card2); display: flex; justify-content: space-between; align-items: center; cursor: default; border-bottom: 1px solid var(--border); }
.bank-group-header .drag-handle { cursor: grab; }
.bank-group-header .drag-handle:active { cursor: grabbing; }
.bank-group-list { padding: 4px 0; }

/* Сумма группы (в заголовке) */
.group-total-val { font-size: 18px; font-weight: 800; color: var(--text); }

/* Универсальная строка счета */
.account-row { display: flex; align-items: center; gap: 10px; padding: 12px 10px; cursor: pointer; transition: 0.1s; border-bottom: 1px solid var(--border); margin: 0 6px; border-radius: 8px;}
.account-row:last-child { border-bottom: none; }
.account-row:active { background: rgba(255,255,255,0.05); }
.account-row { border-left: 4px solid var(--bank-color); border-radius: 0 8px 8px 0; margin-left: 10px; }

.acc-icon { font-size: 28px; width: 40px; text-align: center; flex-shrink: 0; }
.acc-info { flex: 1; min-width: 0; }
.acc-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acc-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.acc-balance { text-align: right; font-weight: 800; font-size: 18px; white-space: nowrap; }
.acc-debt { font-size: 13px; color: var(--debt); font-weight: 700; margin-top: 4px; }

.section-title { font-size: 16px; font-weight: 700; margin: 10px 0 12px 4px; display: flex; justify-content: space-between; align-items: center; }

/* ПК Адаптивность: принудительно одна колонка */
@media (min-width: 800px) {
  .banks-carousel { flex-wrap: wrap; overflow-x: visible; }
  .bank-chip { flex: 1; min-width: 200px; }
  .acc-grid-pc { display: flex; flex-direction: column; gap: 16px; }
  .month-stats { max-width: 600px; }
  .fab { right: calc(50% - 600px + 16px); }
}

.card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--border)}
.stat-card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--border)}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-card .value{font-size:17px;font-weight:700}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted)}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-weight:600;transition:filter .15s}
button:active{filter:brightness(0.9)}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--red);color:#fff}
.btn-small{padding:6px 12px;font-size:13px}
.btn-block{width:100%}
.btn-icon{background:transparent;color:var(--muted);border:none;padding:6px;font-size:16px;border-radius:6px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom); max-width: 1200px; margin: 0 auto;}
.nav-tab{flex:1;background:transparent;border:none;color:var(--muted);padding:8px 2px;text-align:center;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav-tab .nav-icon{font-size:22px;line-height:1}
.nav-tab.active{color:var(--accent)}
.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:16px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(77,127,255,0.4);z-index:101;display:flex;align-items:center;justify-content:center;padding:0}

.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type="date"]{color-scheme:dark}
:root[data-theme="light"] input[type="date"]{color-scheme:light}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.active{display:flex}
#modalBackdrop2{z-index:250;}
.modal{background:var(--card);width:100%;max-width:500px;max-height:85vh;overflow-y:auto;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h2{margin:0;font-size:17px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Вкладка Счета */
.bank-section{background:var(--card);border-radius:14px;margin-bottom:12px;border:1px solid var(--border);overflow:hidden}
.bank-header{padding:12px 14px;background:var(--card2);display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600;font-size:14px}
.bank-total{font-size:16px; font-weight:800; color:var(--text);}

.badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;background:var(--card2);color:var(--muted);font-weight:700;margin-left:4px;text-transform:uppercase}
.progress{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:6px}
.progress-bar{height:100%;background:var(--accent);transition:width .3s}
.progress-bar.green{background:var(--green)}.progress-bar.red{background:var(--red)}.progress-bar.yellow{background:var(--yellow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:6px 14px;font-size:13px;white-space:nowrap;cursor:pointer;font-weight:600}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:14px}
.chart-container{position:relative;height:220px;margin-top:8px}
.tx-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.tx-item:active{background:var(--card2)}
.tx-item .icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-weight:700}
.tx-item .icon.income{background:rgba(46,204,113,0.15);color:var(--green)}
.tx-item .icon.expense{background:rgba(255,92,92,0.15);color:var(--red)}
.tx-item .icon.transfer{background:rgba(77,127,255,0.15);color:var(--accent2)}
.tx-item .icon.debt{background:rgba(245,185,69,0.15);color:var(--yellow)}
.tx-item .body{flex:1;min-width:0}
.tx-item .body .title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-item .body .meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px}
.tx-item .amount{font-weight:700;white-space:nowrap;font-size:14px}
.tx-item .amount.income{color:var(--green)}.tx-item .amount.expense{color:var(--red)}.tx-item .amount.transfer{color:var(--accent2)}.tx-item .amount.debt{color:var(--yellow)}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card2);border-radius:12px;color:var(--text);font-weight:500;cursor:pointer;border:none;text-align:left;width:100%;font-family:inherit;font-size:15px}
.menu-item .menu-icon{font-size:20px}
.menu-item.warn{color:var(--red)}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--card2);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid var(--border);max-width:90%;display:flex;align-items:center;gap:12px}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:var(--accent);color:#fff;padding:4px 10px;border-radius:6px;font-size:12px}
.search-input{margin-bottom:12px;position:relative}
.search-input input{padding-left:36px}
.search-input::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.custom-select-btn{width:100%;text-align:left;padding:10px 12px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.acc-option{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.acc-option:active{background:var(--card2)}
.acc-option .info{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
.bank-badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;display:inline-block}
.bank-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bank-stripe{display:inline-block;width:4px;height:16px;border-radius:2px;margin-right:8px;vertical-align:middle}
.drag-handle{cursor:grab; color:var(--muted); font-size:16px; user-select:none; padding:0 4px; display:inline-block;}
.drag-handle:active{cursor:grabbing;}
</style>
</head>
<body>
<header class="app-header">
  <h1 id="appTitle">💰 Мои финансы</h1>
  <div>
    <button class="icon-btn" id="themeBtn">🌙</button>
    <button class="icon-btn" id="menuBtn">☰</button>
  </div>
</header>
<main>
  <section class="page active" id="page-home"></section>
  <section class="page" id="page-accounts"></section>
  <section class="page" id="page-transactions"></section>
  <section class="page" id="page-stats"></section>
</main>
<button class="fab" id="fabBtn">+</button>
<nav class="bottom-nav">
  <button class="nav-tab active" data-tab="home"><span class="nav-icon">🏠</span>Главная</button>
  <button class="nav-tab" data-tab="accounts"><span class="nav-icon">💳</span>Счета</button>
  <button class="nav-tab" data-tab="transactions"><span class="nav-icon">📋</span>Операции</button>
  <button class="nav-tab" data-tab="stats"><span class="nav-icon">📊</span>Статистика</button>
</nav>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalContent"></div></div>
<div class="modal-backdrop" id="modalBackdrop2"><div class="modal" id="modalContent2"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='financeApp_v24';
const ACC_TYPES={debit:'Дебетовая карта',credit:'Кредитная карта',brokerage:'Брокерский',iis:'ИИС',pds:'ПДС',deposit:'Вклад',savings:'Накопительный',crypto_wallet:'Криптокошелек',crypto_exchange:'Криптобиржа',cash:'Наличные',invest_kopilka:'Инвесткопилка',finu_wallet:'Кошелёк Финуслуги'};
const TERMS={indefinite:'Бессрочный','14d':'14 дней','3m':'3 мес','6m':'6 мес','12m':'1 год','24m':'2 года'};
const TARGET_TYPES=['deposit','savings','brokerage','iis','pds','crypto_wallet','crypto_exchange','invest_kopilka'];
const SAVINGS_TYPES=['deposit','savings'];
const INVEST_TYPES=['brokerage','iis','pds','crypto_wallet','crypto_exchange','invest_kopilka'];

const BANK_COLORS=['#2ecc71','#f5b945','#ff5c5c','#4d7fff','#a78bfa','#ff9f43','#00d2d3','#8395a7'];

const KNOWN_BANKS = {
  'сбер': '#2ecc71', 'sber': '#2ecc71',
  'т-банк': '#f5b945', 'тинькофф': '#f5b945', 'tinkoff': '#f5b945', 'tbank': '#f5b945',
  'альфа': '#ff5c5c', 'alfa': '#ff5c5c',
  'втб': '#4d7fff', 'vtb': '#4d7fff',
  'райф': '#f5b945', 'raif': '#f5b945',
  'озон': '#a78bfa', 'ozon': '#a78bfa',
  'яндекс': '#ff5c5c', 'yandex': '#ff5c5c',
  'финуслуги': '#00d2d3', 'finu': '#00d2d3',
  'мкб': '#4d7fff', 'дом.рф': '#2ecc71', 'бкс': '#4d7fff', 'уралсиб': '#ff5c5c',
  'газпромбанк': '#4d7fff', 'россельхозбанк': '#2ecc71', 'открытие': '#00d2d3', 'росбанк': '#a78bfa', 'совкомбанк': '#f5b945', 'почта банк': '#ff5c5c', 'мтс банк': '#ff5c5c'
};

function defaultState(){return {
  settings:{theme:'dark',accent:'#4d7fff',fontSize:'15px',appTitle:'💰 Мои финансы',usdtRate:{mode:'auto',value:90,lastFetched:null,updatedAt:null},cushionTarget:300000,snapshotFreq:'monthly',badgeStyle:'stripe',pinCode:''},
  ui:{collapsedBanks:[],showArchived:false,lastSnapshot:null},
  categories:[
    {id:'c_sal',type:'income',name:'Зарплата',passive:false},{id:'c_adv',type:'income',name:'Аванс',passive:false},{id:'c_freelance',type:'income',name:'Фриланс',passive:false},{id:'c_gift',type:'income',name:'Подарки',passive:false},{id:'c_cashback',type:'income',name:'Кешбэк',passive:true},{id:'c_coupon',type:'income',name:'Купоны',passive:true},{id:'c_dividend',type:'income',name:'Дивиденды',passive:true},{id:'c_interest',type:'income',name:'Проценты по вкладам',passive:true},{id:'c_taxrefund',type:'income',name:'Возврат налога',passive:true},{id:'c_other_inc',type:'income',name:'Прочий доход',passive:false},
    {id:'c_food',type:'expense',name:'Еда',passive:false},{id:'c_transport',type:'expense',name:'Транспорт',passive:false},{id:'c_housing',type:'expense',name:'Жильё',passive:false},{id:'c_utilities',type:'expense',name:'Коммунальные',passive:false},{id:'c_health',type:'expense',name:'Здоровье',passive:false},{id:'c_fun',type:'expense',name:'Развлечения',passive:false},{id:'c_clothes',type:'expense',name:'Одежда',passive:false},{id:'c_phone',type:'expense',name:'Связь',passive:false},{id:'c_subs',type:'expense',name:'Подписки',passive:false},{id:'c_joint',type:'expense',name:'Совместные расходы',passive:false},{id:'c_services',type:'expense',name:'Оказание услуг',passive:false},{id:'c_taxes',type:'expense',name:'Налоги',passive:false},{id:'c_duty',type:'expense',name:'Госпошлина',passive:false},{id:'c_other_exp',type:'expense',name:'Прочее',passive:false}
  ],
  banks:[{id:'b_main',name:'Основной банк',color:'#2ecc71',parentId:null,order:0},{id:'b_finu',name:'Финуслуги',color:'#00d2d3',parentId:null,order:1,isPlatform:true}],
  accounts:[],transactions:[],budgets:[],debts:[],counterparties:[],snapshots:[]
};}

let S=defaultState();
let dashFilterBank = 'all'; 
let activeTab = 'home';

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const thisMonth=()=>new Date().toISOString().slice(0,7);
const fmt=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n||0);
const fmtNum=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n||0);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(m, actionFn, actionText){
  const t=$('toast');
  t.innerHTML = `<span>${m}</span>` + (actionFn?`<button id="toastAction">${actionText}</button>`:'');
  t.classList.add('show');
  if(actionFn) $('toastAction').onclick=()=>{actionFn();t.classList.remove('show');};
  clearTimeout(t._t);
  t._t=setTimeout(()=>{t.classList.remove('show');t.innerHTML='';}, actionFn?5000:2000);
}

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){
      const p=JSON.parse(r);
      S = {...defaultState(), ...p};
      if(!S.banks.length) S.banks = defaultState().banks;
    } else {
      // Миграция со старых версий
      const oldKeys = ['financeApp_v23', 'financeApp_v22'];
      for(const k of oldKeys) {
         const oldR = localStorage.getItem(k);
         if(oldR) {
            const oldP = JSON.parse(oldR);
            S = {...defaultState(), ...oldP};
            S.settings.badgeStyle = 'stripe';
            break;
         }
      }
    }
  }catch(e){console.error(e);}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Ошибка памяти');}}

function getBank(id){return S.banks.find(b=>b.id===id);}
function getAcc(id){return S.accounts.find(a=>a.id===id);}
function getCat(id){return S.categories.find(c=>c.id===id);}
function getUSDTRate(){return S.settings.usdtRate.mode==='auto'?(S.settings.usdtRate.lastFetched||S.settings.usdtRate.value):S.settings.usdtRate.value;}
function accValue(a){if(!a)return 0;if(a.currency==='USDT')return a.balance*getUSDTRate();return a.balance||0;}
function isTarget(a){return a&&TARGET_TYPES.includes(a.type)&&!a.isTransit;}

function getBankIndicatorHtml(bank) {
  if (!bank) return '';
  const bColor = bank.color || '#888';
  const style = S.settings.badgeStyle;
  if(style==='bg') return `<span class="bank-badge" style="background:${bColor}20; color:${bColor}; border:1px solid ${bColor}40;">${esc(bank.name)}</span>`;
  if(style==='dot') return `<span class="bank-dot" style="background:${bColor}"></span>`;
  if(style==='text') return `<span style="color:${bColor}; font-size:10px; font-weight:700; margin-left:6px;">${esc(bank.name)}</span>`;
  if(style==='stripe') return `<span class="bank-stripe" style="background:${bColor}"></span>`;
  return '';
}

function classifyTransfer(f,t){
  const fA=getAcc(f),tA=getAcc(t);
  if(!fA||!tA)return 'ignore';
  const fT=isTarget(fA),tT=isTarget(tA);
  if(fT===tT)return 'ignore';
  if(!fT&&tT){
    if(SAVINGS_TYPES.includes(tA.type))return 'savings';
    if(INVEST_TYPES.includes(tA.type))return 'investment';
    return 'ignore';
  }
  if(fT&&!tT)return 'withdraw';
  return 'ignore';
}

function recalculateBalances() {
    S.accounts.forEach(a => a.balance = a.initialBalance || 0);
    S.transactions.forEach(t => {
        if (t.type === 'income') {
            const a = getAcc(t.accountId); if (a) a.balance += t.amount;
        } else if (t.type === 'expense') {
            const a = getAcc(t.accountId); if (a) a.balance -= t.amount;
        } else if (t.type === 'transfer') {
            const f = getAcc(t.accountId); const to = getAcc(t.toAccountId);
            if (f) f.balance -= t.amount;
            if (to) to.balance += t.amount;
        } else if (t.type === 'debt') {
            const a = getAcc(t.accountId);
            if (t.debtType === 'lent' || t.debtType === 'repaid') {
                if (a) a.balance -= t.amount;
            } else if (t.debtType === 'borrowed' || t.debtType === 'returned') {
                if (a) a.balance += t.amount;
            }
        }
    });
}

function computeTotals(){
  let totalCap=0,debt=0,creditLimit=0,cushion=0,deposits=0,brokerage=0,crypto=0,pds=0,free=0,cash=0;
  S.accounts.filter(a=>!a.archived).forEach(a=>{
    const v=accValue(a);
    if(a.type==='credit'){
      debt+=v;totalCap-=v;creditLimit+=a.creditLimit||0;
    }else{
      totalCap+=v;
      if(['deposit','savings','finu_wallet'].includes(a.type))deposits+=v;
      if(['brokerage','iis','invest_kopilka'].includes(a.type))brokerage+=v;
      if(a.type==='pds')pds+=v;
      if(['crypto_wallet','crypto_exchange'].includes(a.type))crypto+=v;
      if(a.type==='cash')cash+=v;
      if(['debit','cash'].includes(a.type))free+=v;
    }
    if(a.inCushion&&!a.archived)cushion+=v;
  });
  return{totalCap,debt,creditLimit,cushion,deposits,brokerage,crypto,pds,free,cash};
}

function computeMonth(m){
  m=m||thisMonth();let income=0,expense=0,savings=0,investment=0,passive=0;
  S.transactions.filter(t=>t.date.startsWith(m)).forEach(t=>{
    if(t.type==='income'){
      income+=t.amount;
      const c=getCat(t.categoryId);
      if(c&&c.passive)passive+=t.amount;
    }else if(t.type==='expense'){
      expense+=t.amount;
    }else if(t.type==='transfer'){
      const k=t.savingsKind||classifyTransfer(t.accountId,t.toAccountId);
      if(k==='savings')savings+=t.amount;
      else if(k==='investment')investment+=t.amount;
    }
  });
  return{income,expense,savings,investment,passive,savedTotal:savings+investment,savingsRate:income>0?(savings+investment)/income*100:0};
}
