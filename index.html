<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Мои финансы</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
:root[data-theme="dark"]{--bg:#0f1419;--bg2:#1a1f2b;--card:#1e2532;--card2:#252d3d;--text:#e8ecf3;--muted:#8a94a6;--border:#2a3244;--accent:#4d7fff;--accent2:#6b94ff;--green:#2ecc71;--red:#ff5c5c;--yellow:#f5b945;--purple:#a78bfa}
:root[data-theme="light"]{--bg:#f4f6fb;--bg2:#e8ecf3;--card:#fff;--card2:#f8f9fb;--text:#1c2333;--muted:#7a8399;--border:#e6e9f2;--accent:#3b6ef5;--accent2:#5b82f0;--green:#1e9e6a;--red:#e04a4a;--yellow:#f2a93b;--purple:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:var(--font-size, 15px);padding-bottom:calc(80px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top);overflow-x:hidden;min-height:100vh}
.app-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border)}
.app-header h1{font-size:17px;margin:0;font-weight:700}
.icon-btn{background:transparent;border:none;color:var(--text);font-size:20px;padding:8px;cursor:pointer;border-radius:8px}
.page{display:none;padding:14px}
.page.active{display:block}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--border);cursor:pointer;transition:transform 0.1s}
.stat-card:active{transform:scale(0.98)}
.stat-card .label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-card .value{font-size:17px;font-weight:700}
.stat-card.wide{grid-column:1/-1;cursor:default}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted)}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-weight:600;transition:filter .15s}
button:active{filter:brightness(0.9)}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--red);color:#fff}
.btn-small{padding:6px 12px;font-size:13px}
.btn-block{width:100%}
.btn-icon{background:transparent;color:var(--muted);border:none;padding:6px;font-size:16px;border-radius:6px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-tab{flex:1;background:transparent;border:none;color:var(--muted);padding:8px 2px;text-align:center;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav-tab .nav-icon{font-size:22px;line-height:1}
.nav-tab.active{color:var(--accent)}
.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:16px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(77,127,255,0.4);z-index:101;display:flex;align-items:center;justify-content:center;padding:0}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type="date"]{color-scheme:dark}
:root[data-theme="light"] input[type="date"]{color-scheme:light}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.active{display:flex}
#modalBackdrop2{z-index:250;}
.modal{background:var(--card);width:100%;max-width:500px;max-height:85vh;overflow-y:auto;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h2{margin:0;font-size:17px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bank-section{background:var(--card);border-radius:14px;margin-bottom:12px;border:1px solid var(--border);overflow:hidden}
.bank-header{padding:12px 14px;background:var(--card2);display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600;font-size:14px}
.bank-total{font-size:13px;color:var(--muted);font-weight:500}
.product-item{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.product-item .info{flex:1;min-width:0}
.product-item .name{font-weight:600;font-size:14px; display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
.product-item .meta{font-size:11px;color:var(--muted);margin-top:3px}
.product-item .amount{font-weight:700;font-size:14px;white-space:nowrap;text-align:right}
.badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;background:var(--card2);color:var(--muted);font-weight:700;margin-left:4px;text-transform:uppercase}
.progress{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:6px}
.progress-bar{height:100%;background:var(--accent);transition:width .3s}
.progress-bar.green{background:var(--green)}.progress-bar.red{background:var(--red)}.progress-bar.yellow{background:var(--yellow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:6px 14px;font-size:13px;white-space:nowrap;cursor:pointer;font-weight:600}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:14px}
.chart-container{position:relative;height:220px;margin-top:8px}
.tx-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.tx-item:active{background:var(--card2)}
.tx-item .icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-weight:700}
.tx-item .icon.income{background:rgba(46,204,113,0.15);color:var(--green)}
.tx-item .icon.expense{background:rgba(255,92,92,0.15);color:var(--red)}
.tx-item .icon.transfer{background:rgba(77,127,255,0.15);color:var(--accent2)}
.tx-item .icon.debt{background:rgba(245,185,69,0.15);color:var(--yellow)}
.tx-item .body{flex:1;min-width:0}
.tx-item .body .title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-item .body .meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px}
.tx-item .amount{font-weight:700;white-space:nowrap;font-size:14px}
.tx-item .amount.income{color:var(--green)}.tx-item .amount.expense{color:var(--red)}.tx-item .amount.transfer{color:var(--accent2)}.tx-item .amount.debt{color:var(--yellow)}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card2);border-radius:12px;color:var(--text);font-weight:500;cursor:pointer;border:none;text-align:left;width:100%;font-family:inherit;font-size:15px}
.menu-item .menu-icon{font-size:20px}
.menu-item.warn{color:var(--red)}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--card2);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid var(--border);max-width:90%;display:flex;align-items:center;gap:12px}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:var(--accent);color:#fff;padding:4px 10px;border-radius:6px;font-size:12px}
.search-input{margin-bottom:12px;position:relative}
.search-input input{padding-left:36px}
.search-input::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}
.custom-select-btn{width:100%;text-align:left;padding:10px 12px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.acc-option{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.acc-option:active{background:var(--card2)}
.acc-option .info{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
.bank-badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;display:inline-block}
.bank-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bank-stripe{display:inline-block;width:4px;height:16px;border-radius:2px;margin-right:8px;vertical-align:middle}
.drag-handle{cursor:grab; color:var(--muted); font-size:16px; user-select:none; padding:0 4px; display:inline-block;}
.drag-handle:active{cursor:grabbing;}
</style>
</head>
<body>
<header class="app-header">
  <h1 id="appTitle">💰 Мои финансы</h1>
  <div>
    <button class="icon-btn" id="themeBtn">🌙</button>
    <button class="icon-btn" id="menuBtn">☰</button>
  </div>
</header>
<main>
  <section class="page active" id="page-home"></section>
  <section class="page" id="page-accounts"></section>
  <section class="page" id="page-transactions"></section>
  <section class="page" id="page-stats"></section>
</main>
<button class="fab" id="fabBtn">+</button>
<nav class="bottom-nav">
  <button class="nav-tab active" data-tab="home"><span class="nav-icon">🏠</span>Главная</button>
  <button class="nav-tab" data-tab="accounts"><span class="nav-icon">💳</span>Счета</button>
  <button class="nav-tab" data-tab="transactions"><span class="nav-icon">📋</span>Операции</button>
  <button class="nav-tab" data-tab="stats"><span class="nav-icon">📊</span>Статистика</button>
</nav>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalContent"></div></div>
<div class="modal-backdrop" id="modalBackdrop2"><div class="modal" id="modalContent2"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='financeApp_v22';
const ACC_TYPES={debit:'Дебетовая карта',credit:'Кредитная карта',brokerage:'Брокерский',iis:'ИИС',pds:'ПДС',deposit:'Вклад',savings:'Накопительный',crypto_wallet:'Криптокошелек',crypto_exchange:'Криптобиржа',cash:'Наличные',invest_kopilka:'Инвесткопилка',finu_wallet:'Кошелёк Финуслуги'};
const TERMS={indefinite:'Бессрочный','14d':'14 дней','3m':'3 мес','6m':'6 мес','12m':'1 год','24m':'2 года'};
const TARGET_TYPES=['deposit','savings','brokerage','iis','pds','crypto_wallet','crypto_exchange','invest_kopilka'];
const SAVINGS_TYPES=['deposit','savings'];
const INVEST_TYPES=['brokerage','iis','pds','crypto_wallet','crypto_exchange','invest_kopilka'];

const BANK_COLORS=['#2ecc71','#f5b945','#ff5c5c','#4d7fff','#a78bfa','#ff9f43','#00d2d3','#8395a7'];

const KNOWN_BANKS = {
  'сбер': '#2ecc71', 'sber': '#2ecc71',
  'т-банк': '#f5b945', 'тинькофф': '#f5b945', 'tinkoff': '#f5b945', 'tbank': '#f5b945',
  'альфа': '#ff5c5c', 'alfa': '#ff5c5c',
  'втб': '#4d7fff', 'vtb': '#4d7fff',
  'райф': '#f5b945', 'raif': '#f5b945',
  'озон': '#a78bfa', 'ozon': '#a78bfa',
  'яндекс': '#ff5c5c', 'yandex': '#ff5c5c',
  'финуслуги': '#00d2d3', 'finu': '#00d2d3',
  'мкб': '#4d7fff', 'дом.рф': '#2ecc71', 'бкс': '#4d7fff', 'уралсиб': '#ff5c5c',
  'газпромбанк': '#4d7fff', 'россельхозбанк': '#2ecc71', 'открытие': '#00d2d3', 'росбанк': '#a78bfa', 'совкомбанк': '#f5b945', 'почта банк': '#ff5c5c', 'мтс банк': '#ff5c5c'
};

function defaultState(){return {
  settings:{theme:'dark',accent:'#4d7fff',fontSize:'15px',appTitle:'💰 Мои финансы',usdtRate:{mode:'auto',value:90,lastFetched:null,updatedAt:null},cushionTarget:300000,snapshotFreq:'monthly',badgeStyle:'badge',pinCode:''},
  ui:{collapsedBanks:[],showArchived:false,lastSnapshot:null},
  categories:[
    {id:'c_sal',type:'income',name:'Зарплата',passive:false},{id:'c_adv',type:'income',name:'Аванс',passive:false},{id:'c_freelance',type:'income',name:'Фриланс',passive:false},{id:'c_gift',type:'income',name:'Подарки',passive:false},{id:'c_cashback',type:'income',name:'Кешбэк',passive:true},{id:'c_coupon',type:'income',name:'Купоны',passive:true},{id:'c_dividend',type:'income',name:'Дивиденды',passive:true},{id:'c_interest',type:'income',name:'Проценты по вкладам',passive:true},{id:'c_taxrefund',type:'income',name:'Возврат налога',passive:true},{id:'c_other_inc',type:'income',name:'Прочий доход',passive:false},
    {id:'c_food',type:'expense',name:'Еда',passive:false},{id:'c_transport',type:'expense',name:'Транспорт',passive:false},{id:'c_housing',type:'expense',name:'Жильё',passive:false},{id:'c_utilities',type:'expense',name:'Коммунальные',passive:false},{id:'c_health',type:'expense',name:'Здоровье',passive:false},{id:'c_fun',type:'expense',name:'Развлечения',passive:false},{id:'c_clothes',type:'expense',name:'Одежда',passive:false},{id:'c_phone',type:'expense',name:'Связь',passive:false},{id:'c_subs',type:'expense',name:'Подписки',passive:false},{id:'c_joint',type:'expense',name:'Совместные расходы',passive:false},{id:'c_services',type:'expense',name:'Оказание услуг',passive:false},{id:'c_taxes',type:'expense',name:'Налоги',passive:false},{id:'c_duty',type:'expense',name:'Госпошлина',passive:false},{id:'c_other_exp',type:'expense',name:'Прочее',passive:false}
  ],
  banks:[{id:'b_main',name:'Основной банк',color:'#2ecc71',parentId:null,order:0},{id:'b_finu',name:'Финуслуги',color:'#00d2d3',parentId:null,order:1,isPlatform:true}],
  accounts:[],transactions:[],budgets:[],debts:[],counterparties:[],snapshots:[]
};}

let S=defaultState();
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const thisMonth=()=>new Date().toISOString().slice(0,7);
const fmt=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n||0);
const fmtNum=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n||0);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(m, actionFn, actionText){
  const t=$('toast');
  t.innerHTML = `<span>${m}</span>` + (actionFn?`<button id="toastAction">${actionText}</button>`:'');
  t.classList.add('show');
  if(actionFn) $('toastAction').onclick=()=>{actionFn();t.classList.remove('show');};
  clearTimeout(t._t);
  t._t=setTimeout(()=>{t.classList.remove('show');t.innerHTML='';}, actionFn?5000:2000);
}

function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){
      const p=JSON.parse(r);
      S = {...defaultState(), ...p};
      if(!S.banks.length) S.banks = defaultState().banks;
    }
  }catch(e){console.error(e);}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Ошибка памяти');}}

function getBank(id){return S.banks.find(b=>b.id===id);}
function getAcc(id){return S.accounts.find(a=>a.id===id);}
function getCat(id){return S.categories.find(c=>c.id===id);}
function getUSDTRate(){return S.settings.usdtRate.mode==='auto'?(S.settings.usdtRate.lastFetched||S.settings.usdtRate.value):S.settings.usdtRate.value;}
function accValue(a){if(!a)return 0;if(a.currency==='USDT')return a.balance*getUSDTRate();return a.balance||0;}
function isTarget(a){return a&&TARGET_TYPES.includes(a.type)&&!a.isTransit;}

function getBankIndicatorHtml(bank) {
  if (!bank) return '';
  const bColor = bank.color || '#888';
  const style = S.settings.badgeStyle;
  if(style==='badge') return `<span class="bank-badge" style="background:${bColor}20; color:${bColor}; border:1px solid ${bColor}40;">${esc(bank.name)}</span>`;
  if(style==='dot') return `<span class="bank-dot" style="background:${bColor}"></span>`;
  if(style==='text') return `<span style="color:${bColor}; font-size:10px; font-weight:700; margin-left:6px;">${esc(bank.name)}</span>`;
  if(style==='stripe') return `<span class="bank-stripe" style="background:${bColor}"></span>`;
  return '';
}

function classifyTransfer(f,t){
  const fA=getAcc(f),tA=getAcc(t);
  if(!fA||!tA)return 'ignore';
  const fT=isTarget(fA),tT=isTarget(tA);
  if(fT===tT)return 'ignore';
  if(!fT&&tT){
    if(SAVINGS_TYPES.includes(tA.type))return 'savings';
    if(INVEST_TYPES.includes(tA.type))return 'investment';
    return 'ignore';
  }
  if(fT&&!tT)return 'withdraw';
  return 'ignore';
}

function recalculateBalances() {
    S.accounts.forEach(a => a.balance = a.initialBalance || 0);
    S.transactions.forEach(t => {
        if (t.type === 'income') {
            const a = getAcc(t.accountId); if (a) a.balance += t.amount;
        } else if (t.type === 'expense') {
            const a = getAcc(t.accountId); if (a) a.balance -= t.amount;
        } else if (t.type === 'transfer') {
            const f = getAcc(t.accountId); const to = getAcc(t.toAccountId);
            if (f) f.balance -= t.amount;
            if (to) to.balance += t.amount;
        } else if (t.type === 'debt') {
            const a = getAcc(t.accountId);
            if (t.debtType === 'lent' || t.debtType === 'repaid') {
                if (a) a.balance -= t.amount;
            } else if (t.debtType === 'borrowed' || t.debtType === 'returned') {
                if (a) a.balance += t.amount;
            }
        }
    });
}

function computeTotals(){
  let totalCap=0,debt=0,creditLimit=0,cushion=0,deposits=0,brokerage=0,crypto=0,pds=0,free=0,cash=0;
  S.accounts.filter(a=>!a.archived).forEach(a=>{
    const v=accValue(a);
    if(a.type==='credit'){
      debt+=v;totalCap-=v;creditLimit+=a.creditLimit||0;
    }else{
      totalCap+=v;
      if(['deposit','savings','finu_wallet'].includes(a.type))deposits+=v;
      if(['brokerage','iis','invest_kopilka'].includes(a.type))brokerage+=v;
      if(a.type==='pds')pds+=v;
      if(['crypto_wallet','crypto_exchange'].includes(a.type))crypto+=v;
      if(a.type==='cash')cash+=v;
      if(['debit','cash'].includes(a.type))free+=v;
    }
    if(a.inCushion&&!a.archived)cushion+=v;
  });
  return{totalCap,debt,creditLimit,cushion,deposits,brokerage,crypto,pds,free,cash};
}

function computeMonth(m){
  m=m||thisMonth();let income=0,expense=0,savings=0,investment=0,passive=0;
  S.transactions.filter(t=>t.date.startsWith(m)).forEach(t=>{
    if(t.type==='income'){
      income+=t.amount;
      const c=getCat(t.categoryId);
      if(c&&c.passive)passive+=t.amount;
    }else if(t.type==='expense'){
      expense+=t.amount;
    }else if(t.type==='transfer'){
      const k=t.savingsKind||classifyTransfer(t.accountId,t.toAccountId);
      if(k==='savings')savings+=t.amount;
      else if(k==='investment')investment+=t.amount;
    }
  });
  return{income,expense,savings,investment,passive,savedTotal:savings+investment,savingsRate:income>0?(savings+investment)/income*100:0};
}

function maybeSnapshot(){
  const now=new Date();
  const freq=S.settings.snapshotFreq;
  let shouldSnap=false;
  if(freq==='monthly'){
    const last=new Date(now.getFullYear(),now.getMonth()+1,0);
    if(now.getDate()===last.getDate()) shouldSnap=true;
  }else if(freq==='weekly'){
    if(now.getDay()===0) shouldSnap=true;
  }else if(freq==='daily'){
    shouldSnap=true;
  }
  if(!shouldSnap)return;
  const dateStr=today();
  if(S.snapshots.some(s=>s.date===dateStr))return;
  const t=computeTotals();
  S.snapshots.push({date:dateStr,total:t.totalCap});
  save();
}

function renderHomeAccounts(){
  const el=$('dashAccounts');
  if(!el) return;
  
  let html = '<div id="homeBanksSortable">';
  const topBanks = S.banks.filter(b => !b.parentId).sort((a,b) => (a.order||0) - (b.order||0));
  
  topBanks.forEach(b => {
    const accs = S.accounts.filter(a => a.bankId===b.id && !a.archived).sort((a,b)=>(a.order||0)-(b.order||0));
    const subBanks = S.banks.filter(sb => sb.parentId===b.id).sort((a,b)=>(a.order||0)-(b.order||0));
    
    let total = accs.reduce((s,a)=>s+(a.type==='credit'?-accValue(a):accValue(a)),0);
    
    subBanks.forEach(sb => {
      const subAccs = S.accounts.filter(a => a.bankId===sb.id && !a.archived);
      total += subAccs.reduce((s,a)=>s+(a.type==='credit'?-accValue(a):accValue(a)),0);
    });

    if(accs.length === 0 && subBanks.length === 0 && !b.isPlatform) return;

    const collapsed = S.ui.collapsedBanks.includes(b.id);
    
    html += `<div class="bank-section" data-bank-id="${b.id}">
      <div class="bank-header" onclick="toggleBank('${b.id}')">
        <span style="display:flex; align-items:center;">
          <span class="drag-handle" style="margin-right:8px; color:var(--muted);" onclick="event.stopPropagation()">⋮⋮</span>
          ${collapsed?'▶':'▼'} ${esc(b.name)}
        </span>
        <span class="bank-total">${fmt(total)}</span>
      </div>
      <div class="bank-products" style="${collapsed?'display:none':''}">
        <div class="sub-banks-container">`;
      
    subBanks.forEach(sb => {
      const subAccs = S.accounts.filter(a => a.bankId===sb.id && !a.archived).sort((a,b)=>(a.order||0)-(b.order||0));
      const subTotal = subAccs.reduce((s,a)=>s+(a.type==='credit'?-accValue(a):accValue(a)),0);
      const sbCollapsed = S.ui.collapsedBanks.includes(sb.id);
      
      if(subAccs.length === 0) return;

      html += `<div class="sub-bank-section" data-bank-id="${sb.id}" style="padding-left:10px; border-left:2px solid ${sb.color||'#888'}; margin: 4px 10px;">
        <div style="padding:8px 0; display:flex; justify-content:space-between; cursor:pointer; font-size:13px; font-weight:600;" onclick="event.stopPropagation(); toggleBank('${sb.id}')">
          <span style="display:flex; align-items:center;">
            <span class="drag-handle" style="margin-right:4px; color:var(--muted);" onclick="event.stopPropagation()">⋮⋮</span>
            ${sbCollapsed?'▶':'▼'} ${esc(sb.name)}
          </span>
          <span class="muted">${fmt(subTotal)}</span>
        </div>
        <div style="${sbCollapsed?'display:none':''}">
          ${subAccs.map(a=>renderProductRow(a, sb)).join('')}
        </div>
      </div>`;
    });

    html += `</div>`; 

    accs.forEach(a => { html += renderProductRow(a, b); });

    html += `</div></div>`;
  });
  
  html += `</div>`;
  el.innerHTML = html;

  initHomeSortable();
}

function renderProductRow(a, bank) {
  const bankIndicator = getBankIndicatorHtml(bank);

  let meta = ACC_TYPES[a.type] || a.type;
  if(a.type==='deposit' || a.type==='savings'){
    meta = a.type==='deposit' ? '🔒 Срочный' : '🐷 Бессрочный';
    if(a.rate) meta += ` · ${a.rate}%`;
  }
  
  let graceHtml = '';
  if(a.type==='credit' && a.gracePeriod){
    const daysLeft = Math.ceil((new Date(a.gracePeriod) - new Date()) / (1000*60*60*24));
    let color = daysLeft > 14 ? 'var(--green)' : (daysLeft > 3 ? 'var(--yellow)' : 'var(--red)');
    let text = daysLeft > 0 ? `${daysLeft} дн.` : 'Просрочено';
    graceHtml = `<div style="font-size:10px; font-weight:700; color:${color}; margin-top:4px;">⏳ До ${new Date(a.gracePeriod).toLocaleDateString('ru-RU')} (${text})</div>`;
  }

  const v = accValue(a);
  return `<div class="product-item" onclick="openAccountModal('${a.id}')">
    <div class="info">
      <div class="name">${bankIndicator} ${esc(a.name)} ${a.inCushion?'⭐':''}</div>
      <div class="meta">${meta}</div>
      ${graceHtml}
    </div>
    <div class="amount ${a.type==='credit'?'neg':''}">
      ${a.type==='credit'?'−':''}${fmt(v)}
      ${a.type==='credit' && a.creditLimit ? `<br><span class="muted" style="font-size:10px;font-weight:400">из ${fmt(a.creditLimit)}</span>` : ''}
    </div>
  </div>`;
}

function toggleBank(id){
  const i=S.ui.collapsedBanks.indexOf(id);
  if(i>=0)S.ui.collapsedBanks.splice(i,1);
  else S.ui.collapsedBanks.push(id);
  save();renderDashboard();
}

function openWidget(type){
  let title = ''; let list = [];
  if(type==='free'){ title='Свободные деньги'; list=S.accounts.filter(a=>['debit','cash'].includes(a.type)&&!a.archived); }
  else if(type==='debt'){ title='Кредитные карты'; list=S.accounts.filter(a=>a.type==='credit'&&!a.archived); }
  else if(type==='deposits'){ title='Вклады и накопительные'; list=S.accounts.filter(a=>['deposit','savings','finu_wallet'].includes(a.type)&&!a.archived); }
  else if(type==='brokerage'){ title='Брокерские и ИИС'; list=S.accounts.filter(a=>['brokerage','iis','invest_kopilka'].includes(a.type)&&!a.archived); }
  else if(type==='pds'){ title='ПДС'; list=S.accounts.filter(a=>a.type==='pds'&&!a.archived); }
  else if(type==='crypto'){ title='Крипта'; list=S.accounts.filter(a=>['crypto_wallet','crypto_exchange'].includes(a.type)&&!a.archived); }
  else if(type==='cash'){ title='Наличные'; list=S.accounts.filter(a=>a.type==='cash'&&!a.archived); }
  else if(type==='cushion'){ title='Подушка безопасности'; list=S.accounts.filter(a=>a.inCushion&&!a.archived); }

    let html = `<div class="modal-header"><h2>Детали долгов</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>`;
    if(!S.debts.length) html += '<div class="empty">Нет долгов</div>';
    else {
      S.debts.forEach(d=>{
        const cp=S.counterparties.find(c=>c.id===d.counterpartyId);
        const cpName=cp?cp.name:'?';
        const isLent=d.direction==='lent';
        html+=`<div style="padding:10px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;">

        </div>`;
      });
    }
    openModal(html); return;
  }

  let html = `<div class="modal-header"><h2>${title}</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>`;
  if(!list.length) html += '<div class="empty">Пусто</div>';
  else {
    list.forEach(a=>{
      const b = getBank(a.bankId);
      html += renderProductRow(a, b);
    });
  }
  openModal(html);
}

function deleteBank(id){
  const b = getBank(id);
  if(!b) return;
  if(!confirm(`Удалить "${b.name}" и все его счета (включая под-банки)?`))return;
  
  const toDel = [id, ...S.banks.filter(x=>x.parentId===id).map(x=>x.id)];
  S.accounts=S.accounts.filter(a=>!toDel.includes(a.bankId));
  S.banks=S.banks.filter(x=>!toDel.includes(x.id));
  
  save(); renderAll(); closeModal(); toast('Удалено');
}

function openSubBankModal(parentId){
  openModal(`<div class="modal-header"><h2>Банк внутри платформы</h2><button class="btn-icon" onclick="closeModal()">✕</button></div><form id="subBankForm"><div class="form-group"><label>Название банка</label><input id="sbName" placeholder="Например, МКБ" required oninput="autoColorBank(this.value)"></div><button type="submit" class="btn-primary btn-block">Добавить</button></form>`);
  $('subBankForm').onsubmit=e=>{e.preventDefault();const n=$('sbName').value.trim();if(!n)return;S.banks.push({id:uid(),name:n,color:getBank(parentId).color,parentId:parentId,order:S.banks.length});save();renderAll();closeModal();};
}

function autoColorBank(val) {
  const lower = val.toLowerCase();
  for (const key in KNOWN_BANKS) {
    if (lower.includes(key)) {
      const color = KNOWN_BANKS[key];
      window._selColor = color;
      document.querySelectorAll('.color-opt').forEach(el => {
        el.style.border = 'none';
        if (el.dataset.color === color) {
          el.style.border = '2px solid #fff';
        }
      });
      break;
    }
  }
}

let txFilter='all',txSearch='', txDateStart='', txDateEnd='';
function renderTransactions(){
  const el=$('page-transactions');
  let list=[...S.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  
  if(txFilter!=='all')list=list.filter(t=>t.type===txFilter);
  if(txSearch.trim()){
    const q=txSearch.trim().toLowerCase();
    list=list.filter(t=>{
      const cat=getCat(t.categoryId); const acc=getAcc(t.accountId); const to=getAcc(t.toAccountId);
      return [t.note||'',cat?cat.name:'',acc?acc.name:'',to?to.name:'',String(t.amount),t.date].join(' ').toLowerCase().includes(q);
    });
  }
  if(txDateStart) list=list.filter(t=>t.date>=txDateStart);
  if(txDateEnd) list=list.filter(t=>t.date<=txDateEnd);

  let html=`<div class="search-input"><input id="txSearchInp" type="text" placeholder="Поиск..." value="${esc(txSearch)}"></div>
  <div class="chips">
    <button class="chip ${txFilter==='all'?'active':''}" data-f="all">Все</button>
    <button class="chip ${txFilter==='income'?'active':''}" data-f="income">Доходы</button>
    <button class="chip ${txFilter==='expense'?'active':''}" data-f="expense">Расходы</button>
    <button class="chip ${txFilter==='transfer'?'active':''}" data-f="transfer">Переводы</button>
    <button class="chip ${txFilter==='debt'?'active':''}" data-f="debt">Долги</button>
  </div>
  <div class="form-row" style="margin-bottom:12px">
    <input type="date" id="txDateStart" value="${txDateStart}" onchange="txDateStart=this.value;renderTransactions()" title="С даты">
    <input type="date" id="txDateEnd" value="${txDateEnd}" onchange="txDateEnd=this.value;renderTransactions()" title="По дату">
  </div>`;
  
  if(!list.length)html+='<div class="empty">Нет операций</div>';
  else{let last='';list.forEach(t=>{if(t.date!==last){html+=`<div style="font-size:11px;color:var(--muted);font-weight:700;padding:8px 4px 4px;text-transform:uppercase">${new Date(t.date).toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'})}</div>`;last=t.date;}html+=renderTxItem(t);});}
  el.innerHTML=html;
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{txFilter=c.dataset.f;renderTransactions();});
  const si=$('txSearchInp');if(si){si.oninput=e=>{txSearch=e.target.value;renderTransactions();si.focus();si.setSelectionRange(si.value.length,si.value.length);};}
}

function renderTxItem(t){
  let icon,title,meta,amount,sign,cls;
  if(t.type==='income'){
    const c=getCat(t.categoryId);icon='↓';title=c?c.name:'Доход';cls='income';const a=getAcc(t.accountId);meta=a?a.name:'';sign='+';amount=t.amount;
  }else if(t.type==='expense'){
    const c=getCat(t.categoryId);icon='↑';title=c?c.name:'Расход';cls='expense';const a=getAcc(t.accountId);meta=a?a.name:'';sign='−';amount=t.amount;
  }else if(t.type==='transfer'){
    const f=getAcc(t.accountId),to=getAcc(t.toAccountId);icon='⇄';title=(f?f.name:'?')+' → '+(to?to.name:'?');cls='transfer';
    const k=t.savingsKind||classifyTransfer(t.accountId,t.toAccountId);meta={savings:'в накопления',investment:'в инвестиции',withdraw:'снятие',ignore:'между'}[k]||'';sign='';amount=t.amount;
  }else{
    const cp=S.counterparties.find(c=>c.id===t.counterpartyId); icon='🤝'; cls='debt';
    if(t.debtType==='lent'){ title='Дал в долг: '+(cp?cp.name:''); sign='−'; }
    else if(t.debtType==='returned'){ title='Вернули: '+(cp?cp.name:''); sign='+'; }
    else if(t.debtType==='borrowed'){ title='Взял в долг: '+(cp?cp.name:''); sign='+'; }
    else if(t.debtType==='repaid'){ title='Отдал долг: '+(cp?cp.name:''); sign='−'; }
    meta = getAcc(t.accountId)?.name || ''; amount=t.amount;
  }
  return `<div class="tx-item" onclick="openTxModal('${t.id}')">
    <div class="icon ${cls}">${icon}</div>
    <div class="body"><div class="title">${esc(title)}</div><div class="meta">${esc(meta)}${t.note?' · '+esc(t.note):''}</div></div>
    <div class="amount ${cls}">${sign}${fmt(amount)}</div>
  </div>`;
}

function openTxModal(id){

  const accs=S.accounts.filter(a=>!a.archived);

  const form = tx ? {...tx} : {id:null,type:'expense',amount:'',date:today(),note:'',categoryId:S.categories.find(c=>c.type==='expense')?.id,accountId:accs[0]?.id,toAccountId:accs[1]?.id,savingsKind:null,debtType:'lent',counterpartyId:S.counterparties[0]?.id};

  <div class="modal-header"><h2>${isEdit?'Редактировать':'Новая операция'}</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>
  <form id="txForm">

      <option value="income" ${form.type==='income'?'selected':''}>Доход</option>

      <label>Направление долга</label>
      <select id="txDebtType">
        <option value="lent" ${form.debtType==='lent'?'selected':''}>Я дал в долг</option>
        <option value="returned" ${form.debtType==='returned'?'selected':''}>Мне вернули</option>
        <option value="borrowed" ${form.debtType==='borrowed'?'selected':''}>Я взял в долг</option>
        <option value="repaid" ${form.debtType==='repaid'?'selected':''}>Я отдал долг</option>
      </select>
      <label style="margin-top:10px">Контрагент</label>
      <select id="txCounterparty" onchange="toggleNewCpInput(this.value)">
        ${S.counterparties.map(c=>`<option value="${c.id}" ${form.counterpartyId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
        <option value="__new" ${!S.counterparties.length || form.counterpartyId==='__new'?'selected':''}>+ Новый контрагент</option>
      </select>
      <div id="newCpWrapper" style="display:none; margin-top:8px;">
        <input type="text" id="newCpName" placeholder="Имя нового контрагента">
      </div>
    </div>

    <div class="form-group"><label id="accLabel">Счёт</label>
      <button type="button" class="custom-select-btn" onclick="openAccountPicker('txAccount', 'txAccountBadge')"><span id="txAccountName">Выберите счёт</span><span id="txAccountBadge"></span></button>
      <input type="hidden" id="txAccount" value="${form.accountId||''}">
    </div>

    <div class="form-group" id="toAccGroup" style="display:none"><label>На счёт</label>
      <button type="button" class="custom-select-btn" onclick="openAccountPicker('txToAccount', 'txToAccountBadge')"><span id="txToAccountName">Выберите счёт</span><span id="txToAccountBadge"></span></button>
      <input type="hidden" id="txToAccount" value="${form.toAccountId||''}">
    </div>

    <div class="form-group" id="savKindGroup" style="display:none"><label>Классификация перевода</label><select id="txSavKind"><option value="">Авто</option><option value="savings">В накопления</option><option value="investment">В инвестиции</option><option value="withdraw">Снятие</option><option value="ignore">Не учитывать</option></select></div>
    
    <div class="form-group"><label>Комментарий</label><input id="txNote" type="text" value="${esc(form.note||'')}"></div>

    ${isEdit?`<button type="button" class="btn-danger btn-block" style="margin-top:8px" onclick="deleteTx('${id}')">Удалить</button>`:''}
  </form>`);

  const typeSel=$('txType');
  const upd=()=>{
    const t=typeSel.value;
    $('catGroup').style.display=(t==='income'||t==='expense')?'':'none';
    $('toAccGroup').style.display=t==='transfer'?'':'none';
    $('savKindGroup').style.display=t==='transfer'?'':'none';
    $('debtGroup').style.display=t==='debt'?'':'none';
    $('accLabel').textContent=(t==='transfer'||t==='debt')?'Счёт (источник/получатель)':'Счёт';
    
    if(t==='debt') {
      toggleNewCpInput($('txCounterparty').value);
    }
    
    const cats=S.categories.filter(c=>c.type===t);
    $('txCategory').innerHTML=cats.map(c=>`<option value="${c.id}" ${form.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
    
    const selA = accs.find(a=>a.id===$('txAccount').value) || accs[0];
    if(selA) { $('txAccount').value = selA.id; updateAccDisplay(selA.id, 'txAccountName', 'txAccountBadge'); }
    
    const selTo = accs.find(a=>a.id===$('txToAccount').value) || accs[1] || accs[0];
    if(selTo) { $('txToAccount').value = selTo.id; updateAccDisplay(selTo.id, 'txToAccountName', 'txToAccountBadge'); }
    
    $('txSavKind').value=form.savingsKind||'';
  };
  typeSel.onchange=upd;upd();

  $('txForm').onsubmit=e=>{
    e.preventDefault();
    const t=typeSel.value,amt=parseFloat($('txAmount').value);
    if(!(amt>0)){toast('Сумма > 0');return;}
    const data={id:id||uid(),type:t,amount:amt,date:$('txDate').value,note:$('txNote').value.trim()};
    
    if(t==='transfer'){
      data.accountId=$('txAccount').value; data.toAccountId=$('txToAccount').value;
      data.savingsKind=$('txSavKind').value||null;
      if(data.accountId===data.toAccountId){toast('Разные счета');return;}
    }else if(t==='debt'){
      data.accountId=$('txAccount').value;
      data.debtType=$('txDebtType').value;
      
      let cpId = $('txCounterparty').value;
      if (cpId === '__new') {
        const newName = $('newCpName').value.trim();
        if (!newName) { toast('Введите имя контрагента'); return; }
        const newCp = { id: uid(), name: newName };
        S.counterparties.push(newCp);
        cpId = newCp.id;
      }
      data.counterpartyId = cpId;
      
      // Update debts array
      if(!isEdit) {
        if (data.debtType === 'lent') {
           S.debts.push({id:uid(), direction:'lent', counterpartyId: data.counterpartyId, amount:amt, remaining:amt, date:data.date, accountId:data.accountId, note:data.note});
        } else if (data.debtType === 'borrowed') {
           S.debts.push({id:uid(), direction:'borrowed', counterpartyId: data.counterpartyId, amount:amt, remaining:amt, date:data.date, accountId:data.accountId, note:data.note});
        } else if (data.debtType === 'returned') {
           const d = S.debts.find(x=>x.counterpartyId===data.counterpartyId && x.direction==='lent' && x.remaining>0);
           if(d) d.remaining = Math.max(0, d.remaining - amt);
        } else if (data.debtType === 'repaid') {
           const d = S.debts.find(x=>x.counterpartyId===data.counterpartyId && x.direction==='borrowed' && x.remaining>0);
           if(d) d.remaining = Math.max(0, d.remaining - amt);
        }
      }
    }else{
      data.categoryId=$('txCategory').value; data.accountId=$('txAccount').value;
    }
    
    if(isEdit){
      S.transactions = S.transactions.filter(x=>x.id!==id);
    }
    S.transactions.push(data);
    save();renderAll();closeModal();toast(isEdit?'Сохранено':'Добавлено');
  };
}

  const topBanks = S.banks.filter(b=>!b.parentId);
  topBanks.forEach(b=>{
    const bAccs = accs.filter(a=>a.bankId===b.id);
    const subBanks = S.banks.filter(sb=>sb.parentId===b.id);
    let hasAny = bAccs.length > 0 || subBanks.some(sb=>accs.some(a=>a.bankId===sb.id));
    if(!hasAny) return;
    
    html += `<div style="font-size:12px; color:var(--muted); font-weight:700; margin:12px 0 4px;">${esc(b.name)}</div>`;

function renderStats(){
  const el=$('page-stats');
  const m=computeMonth();
  const t=computeTotals();
  const cp=S.settings.cushionTarget>0?Math.min(100,t.cushion/S.settings.cushionTarget*100):0;
  
  let budgetHTML='';
  if(!S.budgets.length)budgetHTML='<div class="empty" style="padding:14px">Нет бюджетов</div>';
  else{
    S.budgets.forEach(b=>{
      const cat=getCat(b.categoryId); if(!cat)return;
      const spent=S.transactions.filter(t=>t.type==='expense'&&t.categoryId===b.categoryId&&t.date.startsWith(thisMonth())).reduce((s,t)=>s+t.amount,0);
      const pct=b.limit>0?Math.min(100,spent/b.limit*100):0; const cls=pct>100?'red':pct>80?'yellow':'green';
      budgetHTML+=`<div style="padding:10px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
          <strong>${esc(cat.name)}</strong>
          <div><span>${fmt(spent)} / ${fmt(b.limit)}</span> <button class="btn-icon" onclick="openBudgetModal('${b.categoryId}')">✏️</button></div>
        </div>
        <div class="progress"><div class="progress-bar ${cls}" style="width:${pct}%"></div></div>
      </div>`;
    });
  }

  let snapHTML = '';
  if(S.snapshots.length){
    snapHTML = `<table style="width:100%; font-size:13px; text-align:left; border-collapse:collapse;">
      <tr style="border-bottom:1px solid var(--border)"><th>Дата</th><th>Капитал</th></tr>
      ${S.snapshots.slice(-6).reverse().map(s=>`<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 0">${s.date}</td><td>${fmt(s.total)}</td></tr>`).join('')}
    </table>`;
  } else { snapHTML = '<div class="empty">Нет снимков</div>'; }

  el.innerHTML=`
  <div class="stat-grid"><div class="stat-card wide"><div class="label">Итог за ${new Date().toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px"><div><div class="muted" style="font-size:11px">Доходы</div><div class="pos" style="font-weight:700">${fmt(m.income)}</div></div><div><div class="muted" style="font-size:11px">Расходы</div><div class="neg" style="font-weight:700">${fmt(m.expense)}</div></div><div><div class="muted" style="font-size:11px">В накопления</div><div style="font-weight:700">${fmt(m.savings)}</div></div><div><div class="muted" style="font-size:11px">В инвестиции</div><div style="font-weight:700">${fmt(m.investment)}</div></div></div></div><div class="stat-card"><div class="label">Свободный поток</div><div class="value pos">${fmt(m.passive)}</div></div><div class="stat-card"><div class="label">Норма сбережений</div><div class="value">${m.savingsRate.toFixed(0)}%</div></div></div>
  <div class="card"><div style="font-weight:700;margin-bottom:8px">Доходы/расходы (12 мес)</div><div class="chart-container"><canvas id="chartBar"></canvas></div></div>
  <div class="card"><div style="font-weight:700;margin-bottom:8px">Динамика капитала</div><div class="chart-container"><canvas id="chartCapital"></canvas></div></div>
  <div class="card"><div style="font-weight:700;margin-bottom:8px">Отчёт (снимки)</div>${snapHTML}</div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><strong>Бюджеты</strong><button class="btn-small btn-secondary" onclick="openBudgetModal()">+</button></div>${budgetHTML}</div>`;
  
  renderCharts();
}

let c1, c3;
function renderCharts(){
  const months=[];const cur=new Date();
  for(let i=11;i>=0;i--){const d=new Date(cur.getFullYear(),cur.getMonth()-i,1);months.push(d.toISOString().slice(0,7));}
  const inc=months.map(m=>S.transactions.filter(t=>t.type==='income'&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0));
  const exp=months.map(m=>S.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0));
  const labels=months.map(m=>{const [y,mo]=m.split('-');return new Date(y,mo-1).toLocaleDateString('ru-RU',{month:'short'});});
  
  if(c1)c1.destroy();
  if($('chartBar'))c1=new Chart($('chartBar'),{type:'bar',data:{labels,datasets:[{label:'Доходы',data:inc,backgroundColor:'#2ecc71',borderRadius:4},{label:'Расходы',data:exp,backgroundColor:'#ff5c5c',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:10}}}},scales:{y:{beginAtZero:true,ticks:{font:{size:10}}},x:{ticks:{font:{size:9}}}}}});
  
  if(c3)c3.destroy();
  if($('chartCapital')){
    const snapLabels = S.snapshots.map(s=>s.date);
    const snapData = S.snapshots.map(s=>s.total);
    c3=new Chart($('chartCapital'),{type:'line',data:{labels:snapLabels,datasets:[{label:'Капитал',data:snapData,borderColor:'#4d7fff',backgroundColor:'rgba(77,127,255,0.15)',fill:true,tension:0.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{font:{size:10}}},x:{ticks:{font:{size:9}}}}}});
  }
}

function openBudgetModal(catId){
  if(catId){
    const b = S.budgets.find(x=>x.categoryId===catId);
    openModal(`<div class="modal-header"><h2>Изменить бюджет</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>
    <form id="budgetForm"><div class="form-group"><label>Лимит в месяц (₽)</label><input id="budLimit" type="number" value="${b.limit}" required></div>
    <button type="submit" class="btn-primary btn-block">Сохранить</button>
    <button type="button" class="btn-danger btn-block" style="margin-top:8px" onclick="S.budgets=S.budgets.filter(x=>x.categoryId!=='${catId}');save();renderAll();closeModal()">Удалить</button></form>`);
    $('budgetForm').onsubmit=e=>{e.preventDefault();b.limit=parseFloat($('budLimit').value);save();renderAll();closeModal();};
  } else {
    openModal(`<div class="modal-header"><h2>Новый бюджет</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>
    <form id="budgetForm"><div class="form-group"><label>Категория</label><select id="budCat">${S.categories.filter(c=>c.type==='expense').map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
    <div class="form-group"><label>Лимит в месяц (₽)</label><input id="budLimit" type="number" min="1" required></div>
    <button type="submit" class="btn-primary btn-block">Добавить</button></form>`);
    $('budgetForm').onsubmit=e=>{e.preventDefault();const cid=$('budCat').value,lim=parseFloat($('budLimit').value);if(!(lim>0))return;S.budgets.push({categoryId:cid,limit:lim});save();renderAll();closeModal();};
  }
}

function openMenu(){
  openModal(`
  <div class="modal-header"><h2>Меню</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>
  <div class="menu-list">
    <button class="menu-item" onclick="openSettings()"><span class="menu-icon">⚙️</span>Настройки</button>
    <button class="menu-item" onclick="openCategoryEditor()"><span class="menu-icon">📂</span>Редактор категорий</button>
    <button class="menu-item" onclick="openCounterparties()"><span class="menu-icon">👥</span>Контрагенты (Долги)</button>
    <button class="menu-item" onclick="exportJSON()"><span class="menu-icon">💾</span>Скачать бэкап (JSON)</button>
    <button class="menu-item" onclick="importJSON()"><span class="menu-icon">📂</span>Восстановить из JSON</button>
    <button class="menu-item warn" onclick="resetAll()"><span class="menu-icon">🗑</span>Сбросить всё</button>
  </div>`);
}

function openCategoryEditor(){
  let html = `<div class="modal-header"><h2>Категории</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>
  <div class="chips" style="margin-bottom:10px">
    <button class="chip active" id="tabInc" onclick="renderCatList('income')">Доходы</button>
    <button class="chip" id="tabExp" onclick="renderCatList('expense')">Расходы</button>
  </div>
  <div style="display:flex; gap:8px; margin-bottom:12px;">
    <input id="newCatNameInput" type="text" placeholder="Название новой категории" style="flex:1;">
    <button class="btn-primary" onclick="addCategoryInline()">+</button>
  </div>
  <div id="catList"></div>`;
  openModal(html);
  renderCatList('expense');
}

function addCategoryInline(){
  const name = $('newCatNameInput').value.trim();
  if(!name) return;
  const type = $('tabInc').classList.contains('active') ? 'income' : 'expense';
  S.categories.push({id:uid(), type: type, name: name, passive: false}); 
  save(); 
  $('newCatNameInput').value = '';
  renderCatList(type);
}

function renderCatList(type){
  $('tabInc').classList.remove('active'); $('tabExp').classList.remove('active');
  if(type==='income') $('tabInc').classList.add('active'); else $('tabExp').classList.add('active');
  
  const cats = S.categories.filter(c=>c.type===type);
  let html = '';
  cats.forEach(c=>{
    html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border)">
      <input type="text" value="${esc(c.name)}" style="width:70%; padding:6px; background:transparent; border:1px solid transparent; border-radius:4px;" onfocus="this.style.border='1px solid var(--border)'" onblur="this.style.border='1px solid transparent'; if(this.value.trim() && this.value!=='${esc(c.name)}'){updateCatName('${c.id}', this.value.trim())}">
      ${c.passive ? '<span class="badge">ПАССИВНЫЙ</span>' : ''}
      <button class="btn-icon" onclick="deleteCategory('${c.id}')">🗑</button>
    </div>`;
  });
  $('catList').innerHTML = html || '<div class="empty">Нет категорий</div>';
}

function updateCatName(id, name) {
  const c = getCat(id);
  if(c) { c.name = name; save(); }
}

function deleteCategory(id){
  const c = getCat(id);
  if(S.transactions.some(t=>t.categoryId===id)){
    alert('Нельзя удалить: к категории привязаны операции.');
    return;
  }
  S.categories = S.categories.filter(x=>x.id!==id); 
  save(); renderCatList(c.type); 
}

function openCounterparties(){
  const list = S.counterparties.map(c=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
      <span>${esc(c.name)}</span>
      <button class="btn-icon" onclick="delCounterparty('${c.id}')">🗑</button>
    </div>
  `).join('');
  
  openModal(`
    <div class="modal-header"><h2>Контрагенты (Долги)</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input id="newCpNameInput" type="text" placeholder="Имя контрагента" style="flex:1;">
      <button class="btn-primary" onclick="addCounterparty()">Добавить</button>
    </div>
    <div style="max-height:300px; overflow-y:auto;">${list || '<div class="empty">Нет контрагентов</div>'}</div>
  `);
}

function addCounterparty(){
  const n = $('newCpNameInput').value.trim();
  if(!n) return;
  S.counterparties.push({id:uid(), name:n});
  save();
  openCounterparties();
}

function delCounterparty(id){
  S.counterparties = S.counterparties.filter(c=>c.id!==id);
  save();
  openCounterparties();
}

function openSettings(){
  openModal(`
  <div class="modal-header"><h2>Настройки</h2><button class="btn-icon" onclick="closeModal()">✕</button></div>
  <div class="form-group"><label>Название приложения</label><input id="setTitle" value="${esc(S.settings.appTitle)}"></div>
  <div class="form-group"><label>PIN-код (4 цифры, пусто = отключен)</label><input id="setPin" type="text" maxlength="4" value="${S.settings.pinCode}"></div>
  <div class="form-group"><label>Частота снимков</label><select id="setSnap"><option value="monthly" ${S.settings.snapshotFreq==='monthly'?'selected':''}>Раз в месяц</option><option value="weekly" ${S.settings.snapshotFreq==='weekly'?'selected':''}>Раз в неделю</option><option value="daily" ${S.settings.snapshotFreq==='daily'?'selected':''}>Раз в день</option></select></div>
  <div class="form-group"><label>Стиль бейджей банков</label><select id="setBadge"><option value="badge" ${S.settings.badgeStyle==='badge'?'selected':''}>Плашка</option><option value="dot" ${S.settings.badgeStyle==='dot'?'selected':''}>Кружок</option><option value="text" ${S.settings.badgeStyle==='text'?'selected':''}>Текст</option><option value="stripe" ${S.settings.badgeStyle==='stripe'?'selected':''}>Полоска</option></select></div>
  <button class="btn-primary btn-block" onclick="saveSettings()">Сохранить</button>
  <button class="btn-secondary btn-block" style="margin-top:8px" onclick="fetchUSDT()">Обновить курс USDT</button>`);
}

function saveSettings(){
  S.settings.appTitle = $('setTitle').value;
  S.settings.pinCode = $('setPin').value;
  S.settings.snapshotFreq = $('setSnap').value;
  S.settings.badgeStyle = $('setBadge').value;
  save();
  renderAll(); 
  closeModal(); 
  toast('Стиль сохранен: ' + S.settings.badgeStyle);
}

function applySettings(){
  $('appTitle').textContent = S.settings.appTitle;
  document.documentElement.setAttribute('data-theme',S.settings.theme);
  document.body.style.fontSize = S.settings.fontSize;
}

function resetAll(){if(!confirm('Удалить ВСЕ данные?'))return;localStorage.removeItem(KEY);location.reload();}
function exportJSON(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`finance-backup-${today()}.json`;a.click();}
function importJSON(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.transactions||!d.accounts)throw new Error('bad');if(confirm('Заменить данные?')){S=Object.assign(defaultState(),d);save();applySettings();renderAll();closeModal();toast('Восстановлено');}}catch(err){alert('Ошибка: '+err.message);}};r.readAsText(f);};inp.click();}

async function fetchUSDT(){try{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=rub');const d=await r.json();if(d.tether?.rub){S.settings.usdtRate.lastFetched=d.tether.rub;S.settings.usdtRate.updatedAt=new Date().toISOString();save();toast('Курс: '+fmtNum(d.tether.rub)+'₽');renderAll();}}catch(e){toast('Ошибка курса');}}

function applyTheme(){document.documentElement.setAttribute('data-theme',S.settings.theme);$('themeBtn').textContent=S.settings.theme==='dark'?'🌙':'☀️';}
$('themeBtn').onclick=()=>{S.settings.theme=S.settings.theme==='dark'?'light':'dark';save();applyTheme();};

document.querySelectorAll('.nav-tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');$('page-'+t.dataset.tab).classList.add('active');
    if(t.dataset.tab==='stats')renderStats();
    window.scrollTo(0,0);
  };
});

history.pushState(null, null, location.href);
window.onpopstate = function () {
  history.pushState(null, null, location.href);
  if(confirm('Вы уверены, что хотите выйти?')) { history.back(); }
};

$('fabBtn').onclick=()=>openTxModal();
$('menuBtn').onclick=openMenu;

function renderAll(){
  applySettings();
  renderDashboard();
  renderAccounts();
  renderTransactions();
  renderStats();
}

load();
applyTheme();
applySettings();
maybeSnapshot();
renderAll();
if(S.settings.usdtRate.mode==='auto')fetchUSDT();

let startY = 0;
document.addEventListener('touchstart', e => { startY = e.touches[0].pageY; }, {passive: true});
document.addEventListener('touchmove', e => {
  if(document.querySelector('.modal-backdrop.active')) {
    if(e.touches[0].pageY > startY && window.scrollY === 0) e.preventDefault();
  }
}, {passive: false});

</script>
</body>
</html>
